# ArticleToMotion 工具配置
# 取值优先级：环境变量 > .env > 本文件 > 内置默认
# 编排工具：codex | claude | qoder | codebuddy | opencode
ORCHESTRATOR=codex
# 渲染工具：codex | claude | qoder | codebuddy | opencode（必须与 ORCHESTRATOR 不同）
RENDERER=claude
# TTS 工具：minimax | bailian（完整制作流程需要）
TTS_PROVIDER=minimax
# 镜头并发数：1-16，默认 3
SCENE_JOBS=3
