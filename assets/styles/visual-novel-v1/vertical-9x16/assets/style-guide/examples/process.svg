fill="#B9A8D6" opacity="0.35"/><circle cx="121.5" cy="378" r="7" fill="#B9A8D6"/><text x="148" y="386" font-family="'Noto Sans SC', sans-serif" font-size="22" font-weight="700" fill="#B9A8D6" letter-spacing="2">旁白</text><text x="148" y="438" font-family="'LXGW WenKai', 'Noto Sans SC', sans-serif" font-size="32" fill="#B9A8D6">深夜十一点，报告还是空白的。</text><circle cx="121.5" cy="528" r="7" fill="#B9A8D6"/><text x="148" y="536" font-family="'Noto Sans SC', sans-serif" font-size="22" font-weight="700" fill="#B9A8D6" letter-spacing="2">阿遥</text><text x="148" y="588" font-family="'LXGW WenKai', 'Noto Sans SC', sans-serif" font-size="32" fill="#B9A8D6">我明明知道该做，为什么就是不想动？</text><circle cx="121.5" cy="678" r="7" fill="#E8A0B4"/><text x="148" y="686" font-family="'Noto Sans SC', sans-serif" font-size="22" font-weight="700" fill="#E8A0B4" letter-spacing="2">林老师</text><text x="148" y="738" font-family="'LXGW WenKai', 'Noto Sans SC', sans-serif" font-size="32" fill="#B9A8D6">因为这件事让你联想到了不舒服的感受。</text><circle cx="121.5" cy="828" r="7" fill="#B9A8D6"/><text x="148" y="836" font-family="'Noto Sans SC', sans-serif" font-size="22" font-weight="700" fill="#B9A8D6" letter-spacing="2">阿遥</text><text x="148" y="888" font-family="'LXGW WenKai', 'Noto Sans SC', sans-serif" font-size="32" fill="#B9A8D6">所以我躲的不是任务，而是那种感受？</text><g><rect x="88" y="1216" width="904" height="230" rx="28" fill="#1E1830" fill-opacity="0.86" stroke="#B9A8D6" stroke-opacity="0.35" stroke-width="1.5"/><rect x="100" y="1228" width="880" height="206" rx="20" fill="none" stroke="#B9A8D6" stroke-opacity="0.14" stroke-width="1"/><rect x="120" y="1190" width="124" height="46" rx="23.0" fill="#E8A0B4"/><text x="182.0" y="1222" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="24" font-weight="600" fill="#221A30" letter-spacing="1">林老师</text><text x="128" y="1298" font-family="'LXGW WenKai', 'Noto Sans SC', sans-serif" font-size="34" fill="#F6F0FA">对。把第一步缩小到<tspan fill="#F3C77A">五分钟</tspan>就能做完，</text><text x="128" y="1351" font-family="'LXGW WenKai', 'Noto Sans SC', sans-serif" font-size="34" fill="#F6F0FA">大脑就不会再把它当</text><rect x="442" y="1321" width="3" height="36" fill="#F3C77A"/><text x="962" y="1264" text-anchor="end" font-family="'Noto Sans SC', sans-serif" font-size="22" font-weight="600" fill="#B9A8D6">4 / 5</text></g><rect width="1080" height="1920" fill="url(#vign)"/><g fill="none" stroke="#B9A8D6" stroke-opacity="0.35" stroke-width="2"><path d="M40 140v-44h44 M996 96h44v44 M40 1820v40h44 M996 1860h44v-40"/></g></svg>
