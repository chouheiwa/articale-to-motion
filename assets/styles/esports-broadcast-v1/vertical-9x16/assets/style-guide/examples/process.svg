<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <pattern id="stripes" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(16)">
      <rect width="8" height="24" fill="#26314A"/>
    </pattern>
  </defs>
  <rect width="1080" height="1920" fill="#0B0F1A"/>

  <!-- background layer -->
  <path d="M780 420 H1040 V760 Z" fill="url(#stripes)" opacity="0.45"/>
  <text x="1036" y="1856" text-anchor="end" fill="#141B2D" font-size="300" font-family="'Bebas Neue', 'Noto Sans SC', sans-serif">M20</text>
  <g fill="none" stroke="#26314A" stroke-width="3">
    <path d="M40 150 V96 H100"/>
    <path d="M980 96 H1040 V150"/>
    <path d="M40 1806 V1860 H100"/>
  </g>

  <!-- header -->
  <path d="M103 120 H318 L303 172 H88 Z" fill="#141B2D"/>
  <path d="M103 120 H115 L100 172 H88 Z" fill="#2F8CFF"/>
  <text x="126" y="157" fill="#F2F5FA" font-size="28" font-weight="700" font-family="'Noto Sans SC', sans-serif" letter-spacing="2">比赛时间线</text>
  <text x="992" y="156" text-anchor="end" fill="#8C9BB5" font-size="24" font-weight="600" font-family="'Oxanium', 'Noto Sans SC', monospace" letter-spacing="1">R03 / 12:00</text>
  <rect x="88" y="200" width="904" height="2" fill="#26314A"/>
  <rect x="88" y="200" width="220" height="2" fill="#2F8CFF"/>

  <g font-family="'Noto Sans SC', sans-serif" font-weight="900">
    <text x="84" y="316" fill="#F2F5FA" font-size="72">从单体到微服务</text>
    <text x="84" y="404" fill="#2F8CFF" font-size="72">20 个月的赛程</text>
  </g>
  <text x="88" y="462" fill="#8C9BB5" font-size="30" font-family="'Noto Sans SC', sans-serif">一次拆分，决定了后面一年的节奏。</text>

  <!-- track -->
  <rect x="158" y="530" width="4" height="1000" fill="#26314A"/>
  <rect x="158" y="530" width="4" height="380" fill="#2F8CFF"/>

  <g font-family="'Noto Sans SC', sans-serif">
    <!-- node 0 -->
    <path d="M160 548 L172 560 L160 572 L148 560 Z" fill="#2F8CFF"/>
    <text x="200" y="546" fill="#8C9BB5" font-size="24" font-weight="600" font-family="'Oxanium', 'Noto Sans SC', monospace" letter-spacing="1">MONTH 00</text>
    <text x="200" y="590" fill="#F2F5FA" font-size="36" font-weight="700">单体上线，一周三次发布</text>
    <text x="200" y="630" fill="#8C9BB5" font-size="26">一个仓库，一条流水线</text>

    <!-- node 1 -->
    <path d="M160 708 L172 720 L160 732 L148 720 Z" fill="#2F8CFF"/>
    <text x="200" y="706" fill="#8C9BB5" font-size="24" font-weight="600" font-family="'Oxanium', 'Noto Sans SC', monospace" letter-spacing="1">MONTH 03</text>
    <text x="200" y="750" fill="#F2F5FA" font-size="36" font-weight="700">用户破万，单库开始吃紧</text>
    <text x="200" y="790" fill="#8C9BB5" font-size="26">慢查询从每天 2 次涨到 40 次</text>

    <!-- turning point -->
    <path d="M160 890 L180 910 L160 930 L140 910 Z" fill="#FF3B4E"/>
    <path d="M200 830 H900 V1000 H200 Z" fill="#141B2D" stroke="#26314A" stroke-width="2"/>
    <rect x="200" y="830" width="8" height="170" fill="#FF3B4E"/>
    <path d="M242 852 H372 L362 892 H232 Z" fill="#B8182E"/>
    <text x="302" y="882" text-anchor="middle" fill="#F2F5FA" font-size="26" font-weight="700">转折点</text>
    <text x="876" y="882" text-anchor="end" fill="#8C9BB5" font-size="24" font-weight="600" font-family="'Oxanium', 'Noto Sans SC', monospace" letter-spacing="1">MONTH 08</text>
    <text x="232" y="944" fill="#F2F5FA" font-size="42" font-weight="900">订单模块先拆出去</text>
    <text x="232" y="982" fill="#8C9BB5" font-size="26">只拆最痛的一块，其余保持单体</text>

    <!-- node 3 -->
    <path d="M160 1078 L172 1090 L160 1102 L148 1090 Z" fill="#8C9BB5"/>
    <text x="200" y="1076" fill="#8C9BB5" font-size="24" font-weight="600" font-family="'Oxanium', 'Noto Sans SC', monospace" letter-spacing="1">MONTH 11</text>
    <text x="200" y="1120" fill="#F2F5FA" font-size="36" font-weight="700">支付服务独立，第二次拆分</text>
    <text x="200" y="1160" fill="#8C9BB5" font-size="26">沿用订单拆分时写好的接口约定</text>

    <!-- node 4 -->
    <path d="M160 1238 L172 1250 L160 1262 L148 1250 Z" fill="#8C9BB5"/>
    <text x="200" y="1236" fill="#8C9BB5" font-size="24" font-weight="600" font-family="'Oxanium', 'Noto Sans SC', monospace" letter-spacing="1">MONTH 14</text>
    <text x="200" y="1280" fill="#F2F5FA" font-size="36" font-weight="700">拆出 6 个服务，发布互不阻塞</text>
    <text x="200" y="1320" fill="#8C9BB5" font-size="26">每个服务独立部署、独立回滚</text>

    <!-- node 5 -->
    <path d="M160 1396 L174 1410 L160 1424 L146 1410 Z" fill="#3DDC84"/>
    <text x="200" y="1396" fill="#3DDC84" font-size="24" font-weight="600" font-family="'Oxanium', 'Noto Sans SC', monospace" letter-spacing="1">MONTH 20 / NOW</text>
    <text x="200" y="1440" fill="#F2F5FA" font-size="36" font-weight="700">局面稳定，故障只影响单个服务</text>
    <text x="200" y="1480" fill="#8C9BB5" font-size="26">平均恢复时间 18 分钟</text>
  </g>

  <!-- summary strip -->
  <path d="M88 1560 H900 L884 1630 H88 Z" fill="#141B2D"/>
  <text x="112" y="1606" fill="#8C9BB5" font-size="26" font-family="'Noto Sans SC', sans-serif">每周发布次数</text>
  <text x="876" y="1614" text-anchor="end" fill="#F2F5FA" font-size="44" font-family="'Bebas Neue', 'Noto Sans SC', sans-serif" letter-spacing="2">3 → 21</text>
</svg>
