      <rect x="212" y="70" width="320" height="12" fill="#8C9BB5"/>
      <text x="876" y="82" text-anchor="end" fill="#8C9BB5" font-size="74" font-family="'Bebas Neue', 'Noto Sans SC', sans-serif">64</text>
