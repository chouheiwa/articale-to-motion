      <text x="148" y="76" text-anchor="middle" fill="#8C9BB5" font-size="58" font-family="'Bebas Neue', 'Noto Sans SC', sans-serif">6</text>
      <text x="212" y="52" fill="#F2F5FA" font-size="34" font-weight="600">事件驱动</text>
      <rect x="212" y="70" width="500" height="12" fill="#26314A"/>
      <rect x="212" y="70" width="300" height="12" fill="#8C9BB5"/>
      <text x="876" y="82" text-anchor="end" fill="#8C9BB5" font-size="74" font-family="'Bebas Neue', 'Noto Sans SC', sans-serif">60</text>
    </g>

    <text x="88" y="1270" fill="#8C9BB5" font-size="24">评分口径：上线速度 30%，运维成本 30%，扩展性 40%</text>

    <!-- champion breakdown -->
    <text x="88" y="1336" fill="#8C9BB5" font-size="24">冠军得分构成</text>
    <rect x="88" y="1356" width="238" height="16" fill="#F2F5FA"/>
    <rect x="330" y="1356" width="230" height="16" fill="#F2F5FA" opacity="0.55"/>
    <rect x="564" y="1356" width="336" height="16" fill="#F2F5FA" opacity="0.3"/>
    <text x="88" y="1414" fill="#F2F5FA" font-size="24">上线速度 28</text>
    <text x="330" y="1414" fill="#F2F5FA" font-size="24">运维成本 27</text>
    <text x="564" y="1414" fill="#F2F5FA" font-size="24">扩展性 37</text>
