  <!-- lower third -->
  <path d="M88 1466 H900 L878 1548 H88 Z" fill="#141B2D"/>
  <rect x="88" y="1466" width="10" height="82" fill="#2F8CFF"/>
  <text x="122" y="1519" fill="#F2F5FA" font-size="34" font-weight="700" font-family="'Noto Sans SC', sans-serif">冠军：模块化单体，边界清晰再拆</text>
  <text x="852" y="1518" text-anchor="end" fill="#2F8CFF" font-size="30" font-family="'Bebas Neue', 'Noto Sans SC', sans-serif" letter-spacing="3">CHAMPION</text>
