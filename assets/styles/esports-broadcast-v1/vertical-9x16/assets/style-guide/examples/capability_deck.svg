      <text x="876" y="92" text-anchor="end" fill="#F2F5FA" font-size="92" font-family="'Bebas Neue', 'Noto Sans SC', sans-serif">92</text>
    </g>
    <!-- row 2 -->
    <g transform="translate(0 626)">
