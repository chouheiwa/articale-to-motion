  </defs>
  <rect width="1080" height="1440" fill="#0B0F1A"/>

  <!-- background layer -->
  <path d="M700 230 H1040 V660 Z" fill="url(#stripes)" opacity="0.45"/>
  <path d="M1040 700 V1100 L760 1380 H600 Z" fill="#141B2D" opacity="0.55"/>
  <text x="1036" y="1376" text-anchor="end" fill="#141B2D" font-size="300" font-family="'Bebas Neue', 'Noto Sans SC', sans-serif" letter-spacing="6">MVP</text>
  <g fill="none" stroke="#26314A" stroke-width="3">
    <path d="M40 150 V96 H100"/>
    <path d="M980 96 H1040 V150"/>
    <path d="M40 1326 V1380 H100"/>
  </g>

  <!-- header -->
  <path d="M103 120 H292 L277 172 H88 Z" fill="#141B2D"/>
  <path d="M103 120 H115 L100 172 H88 Z" fill="#2F8CFF"/>
  <text x="126" y="157" fill="#F2F5FA" font-size="28" font-weight="700" font-family="'Noto Sans SC', sans-serif" letter-spacing="2">MVP 卡</text>
  <circle cx="742" cy="147" r="7" fill="#3DDC84"/>
  <text x="758" y="157" fill="#3DDC84" font-size="28" font-family="'Bebas Neue', 'Noto Sans SC', sans-serif" letter-spacing="2">LIVE</text>
  <text x="992" y="156" text-anchor="end" fill="#8C9BB5" font-size="24" font-weight="600" font-family="'Oxanium', 'Noto Sans SC', monospace" letter-spacing="1">R01 / 04:12</text>
  <rect x="88" y="200" width="904" height="2" fill="#26314A"/>
  <rect x="88" y="200" width="220" height="2" fill="#2F8CFF"/>

  <!-- headline -->
  <g font-family="'Noto Sans SC', sans-serif" font-weight="900">
    <text x="84" y="350" fill="#F2F5FA" font-size="88" letter-spacing="-1">小团队的赛点</text>
    <text x="84" y="452" fill="#2F8CFF" font-size="88" letter-spacing="-1">先打单体</text>
  </g>
  <text x="88" y="512" fill="#8C9BB5" font-size="30" font-family="'Noto Sans SC', sans-serif">10 人以内，上线速度决定胜负。</text>

  <!-- MVP card -->
  <path d="M88 564 H860 L900 604 V1070 H128 L88 1030 Z" fill="#141B2D" stroke="#26314A" stroke-width="2"/>
  <path d="M88 564 H520 L514 572 H88 Z" fill="#FFC23D"/>
  <path d="M141 600 H266 L249 660 H124 Z" fill="#FFC23D"/>
  <text x="195" y="647" text-anchor="middle" fill="#0B0F1A" font-size="48" font-family="'Bebas Neue', 'Noto Sans SC', sans-serif" letter-spacing="2">MVP</text>
  <text x="290" y="643" fill="#F2F5FA" font-size="34" font-weight="700" font-family="'Noto Sans SC', sans-serif">单体架构</text>
  <text x="862" y="642" text-anchor="end" fill="#2F8CFF" font-size="30" font-family="'Bebas Neue', 'Noto Sans SC', sans-serif" letter-spacing="3">TEAM MONO</text>
  <rect x="124" y="688" width="740" height="2" fill="#26314A"/>

  <text x="118" y="872" fill="#F2F5FA" font-size="210" font-family="'Bebas Neue', 'Noto Sans SC', sans-serif">3.2X</text>
  <text x="520" y="792" fill="#F2F5FA" font-size="34" font-weight="700" font-family="'Noto Sans SC', sans-serif">上线速度</text>
  <text x="520" y="838" fill="#8C9BB5" font-size="26" font-family="'Noto Sans SC', sans-serif">对比同规模微服务团队</text>
  <rect x="124" y="912" width="740" height="2" fill="#26314A"/>

  <g font-family="'Noto Sans SC', sans-serif">
    <text x="124" y="1004" fill="#F2F5FA" font-size="76" font-family="'Bebas Neue', 'Noto Sans SC', sans-serif">12</text>
    <text x="124" y="1042" fill="#8C9BB5" font-size="24">次部署 / 周</text>
    <rect x="352" y="940" width="2" height="104" fill="#26314A"/>
    <text x="378" y="1004" fill="#F2F5FA" font-size="76" font-family="'Bebas Neue', 'Noto Sans SC', sans-serif">18</text>
    <text x="378" y="1042" fill="#8C9BB5" font-size="24">分钟定位故障</text>
    <rect x="606" y="940" width="2" height="104" fill="#26314A"/>
    <text x="632" y="1004" fill="#F2F5FA" font-size="76" font-family="'Bebas Neue', 'Noto Sans SC', sans-serif">2</text>
    <text x="632" y="1042" fill="#8C9BB5" font-size="24">天新人上手</text>
  </g>

  <!-- lower third -->
  <path d="M88 1098 H900 L880 1170 H88 Z" fill="#141B2D"/>
  <rect x="88" y="1098" width="10" height="72" fill="#2F8CFF"/>
  <text x="122" y="1145" fill="#F2F5FA" font-size="32" font-weight="700" font-family="'Noto Sans SC', sans-serif">结论：先跑通业务，再谈拆分</text>
  <text x="852" y="1144" text-anchor="end" fill="#2F8CFF" font-size="28" font-family="'Bebas Neue', 'Noto Sans SC', sans-serif" letter-spacing="3">VERDICT</text>
</svg>
