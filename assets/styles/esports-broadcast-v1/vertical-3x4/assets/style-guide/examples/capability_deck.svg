<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440">
  <defs>
    <pattern id="stripes" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(16)">
      <rect width="8" height="24" fill="#26314A"/>
    </pattern>
  </defs>
  <rect width="1080" height="1440" fill="#0B0F1A"/>

  <!-- background layer -->
  <path d="M40 1380 V980 L440 1380 Z" fill="url(#stripes)" opacity="0.4"/>
  <path d="M1040 230 V760 L760 230 Z" fill="#141B2D" opacity="0.7"/>
  <g fill="none" stroke="#26314A" stroke-width="3">
    <path d="M40 150 V96 H100"/>
    <path d="M980 96 H1040 V150"/>
    <path d="M980 1380 H1040 V1326"/>
  </g>

  <!-- header -->
  <path d="M103 120 H262 L247 172 H88 Z" fill="#141B2D"/>
  <path d="M103 120 H115 L100 172 H88 Z" fill="#2F8CFF"/>
  <text x="126" y="157" fill="#F2F5FA" font-size="28" font-weight="700" font-family="'Noto Sans SC', sans-serif" letter-spacing="2">积分榜</text>
  <rect x="890" y="124" width="102" height="44" rx="22" fill="none" stroke="#3DDC84" stroke-width="2"/>
  <text x="941" y="157" text-anchor="middle" fill="#3DDC84" font-size="30" font-family="'Bebas Neue', 'Noto Sans SC', sans-serif" letter-spacing="2">FINAL</text>
  <rect x="88" y="200" width="904" height="2" fill="#26314A"/>
  <rect x="88" y="200" width="220" height="2" fill="#2F8CFF"/>

  <text x="86" y="294" fill="#F2F5FA" font-size="60" font-weight="900" font-family="'Noto Sans SC', sans-serif">架构方案积分榜</text>
  <text x="88" y="344" fill="#8C9BB5" font-size="26" font-family="'Noto Sans SC', sans-serif">场景：10 人团队，日活 5 万</text>

  <g font-family="'Noto Sans SC', sans-serif">
    <text x="104" y="410" fill="#8C9BB5" font-size="24">名次</text>
    <text x="208" y="410" fill="#8C9BB5" font-size="24">方案</text>
    <text x="876" y="410" text-anchor="end" fill="#8C9BB5" font-size="24">综合得分</text>
    <rect x="88" y="428" width="812" height="2" fill="#26314A"/>

    <!-- row 1 -->
    <g transform="translate(0 446)">
      <path d="M88 0 H900 V96 H88 Z" fill="#141B2D" stroke="#FFC23D" stroke-width="2"/>
      <path d="M121 16 H180 L166 80 H107 Z" fill="#FFC23D"/>
      <text x="143" y="70" text-anchor="middle" fill="#0B0F1A" font-size="56" font-family="'Bebas Neue', 'Noto Sans SC', sans-serif">1</text>
      <text x="208" y="48" fill="#F2F5FA" font-size="34" font-weight="700">模块化单体</text>
      <rect x="208" y="64" width="520" height="10" fill="#26314A"/>
      <rect x="208" y="64" width="478" height="10" fill="#FFC23D"/>
      <text x="876" y="76" text-anchor="end" fill="#F2F5FA" font-size="76" font-family="'Bebas Neue', 'Noto Sans SC', sans-serif">92</text>
    </g>
    <!-- row 2 -->
    <g transform="translate(0 558)">
      <path d="M88 0 H900 V96 H88 Z" fill="#141B2D" stroke="#2F8CFF" stroke-width="2"/>
      <path d="M121 16 H180 L166 80 H107 Z" fill="none" stroke="#26314A" stroke-width="2"/>
      <text x="143" y="70" text-anchor="middle" fill="#8C9BB5" font-size="52" font-family="'Bebas Neue', 'Noto Sans SC', sans-serif">2</text>
      <text x="208" y="48" fill="#F2F5FA" font-size="32" font-weight="600">单体</text>
      <rect x="208" y="64" width="520" height="10" fill="#26314A"/>
      <rect x="208" y="64" width="442" height="10" fill="#2F8CFF"/>
      <text x="876" y="74" text-anchor="end" fill="#F2F5FA" font-size="64" font-family="'Bebas Neue', 'Noto Sans SC', sans-serif">85</text>
    </g>
    <!-- row 3 -->
    <g transform="translate(0 670)">
      <path d="M88 0 H900 V96 H88 Z" fill="#141B2D" stroke="#FF3B4E" stroke-width="2"/>
      <path d="M121 16 H180 L166 80 H107 Z" fill="none" stroke="#26314A" stroke-width="2"/>
      <text x="143" y="70" text-anchor="middle" fill="#8C9BB5" font-size="52" font-family="'Bebas Neue', 'Noto Sans SC', sans-serif">3</text>
      <text x="208" y="48" fill="#F2F5FA" font-size="32" font-weight="600">微服务</text>
      <rect x="208" y="64" width="520" height="10" fill="#26314A"/>
      <rect x="208" y="64" width="406" height="10" fill="#FF3B4E"/>
      <text x="876" y="74" text-anchor="end" fill="#F2F5FA" font-size="64" font-family="'Bebas Neue', 'Noto Sans SC', sans-serif">78</text>
    </g>
    <!-- row 4 -->
    <g transform="translate(0 782)">
      <path d="M88 0 H900 V96 H88 Z" fill="#141B2D"/>
      <path d="M121 16 H180 L166 80 H107 Z" fill="none" stroke="#26314A" stroke-width="2"/>
      <text x="143" y="70" text-anchor="middle" fill="#8C9BB5" font-size="52" font-family="'Bebas Neue', 'Noto Sans SC', sans-serif">4</text>
      <text x="208" y="48" fill="#F2F5FA" font-size="32" font-weight="600">Serverless</text>
      <rect x="208" y="64" width="520" height="10" fill="#26314A"/>
      <rect x="208" y="64" width="369" height="10" fill="#8C9BB5"/>
      <text x="876" y="74" text-anchor="end" fill="#8C9BB5" font-size="64" font-family="'Bebas Neue', 'Noto Sans SC', sans-serif">71</text>
    </g>
    <!-- row 5 -->
    <g transform="translate(0 894)">
      <path d="M88 0 H900 V96 H88 Z" fill="#141B2D"/>
      <path d="M121 16 H180 L166 80 H107 Z" fill="none" stroke="#26314A" stroke-width="2"/>
      <text x="143" y="70" text-anchor="middle" fill="#8C9BB5" font-size="52" font-family="'Bebas Neue', 'Noto Sans SC', sans-serif">5</text>
      <text x="208" y="48" fill="#F2F5FA" font-size="32" font-weight="600">服务网格</text>
      <rect x="208" y="64" width="520" height="10" fill="#26314A"/>
      <rect x="208" y="64" width="333" height="10" fill="#8C9BB5"/>
      <text x="876" y="74" text-anchor="end" fill="#8C9BB5" font-size="64" font-family="'Bebas Neue', 'Noto Sans SC', sans-serif">64</text>
    </g>

    <text x="88" y="1040" fill="#8C9BB5" font-size="24">评分口径：上线速度 30%，运维成本 30%，扩展性 40%</text>
  </g>

  <!-- lower third -->
  <path d="M88 1086 H900 L880 1164 H88 Z" fill="#141B2D"/>
  <rect x="88" y="1086" width="10" height="78" fill="#2F8CFF"/>
  <text x="122" y="1136" fill="#F2F5FA" font-size="32" font-weight="700" font-family="'Noto Sans SC', sans-serif">冠军：模块化单体，边界清晰再拆</text>
  <text x="852" y="1135" text-anchor="end" fill="#2F8CFF" font-size="28" font-family="'Bebas Neue', 'Noto Sans SC', sans-serif" letter-spacing="3">CHAMPION</text>
</svg>
