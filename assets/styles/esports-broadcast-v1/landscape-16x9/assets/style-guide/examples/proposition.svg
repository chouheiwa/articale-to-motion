  <text x="1162" y="307" fill="#F2F5FA" font-size="34" font-weight="700" font-family="'Noto Sans SC', sans-serif">单体架构</text>
  <text x="1722" y="306" text-anchor="end" fill="#2F8CFF" font-size="30" font-family="'Bebas Neue', 'Noto Sans SC', sans-serif" letter-spacing="3">TEAM MONO</text>
