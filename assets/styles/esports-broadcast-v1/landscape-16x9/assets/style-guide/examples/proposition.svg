    <rect x="1230" y="600" width="2" height="104" fill="#26314A"/>
    <text x="1256" y="664" fill="#F2F5FA" font-size="76" font-family="'Bebas Neue', 'Noto Sans SC', sans-serif">18</text>
    <text x="1256" y="702" fill="#8C9BB5" font-size="24">分钟定位故障</text>
    <rect x="1490" y="600" width="2" height="104" fill="#26314A"/>
    <text x="1516" y="664" fill="#F2F5FA" font-size="76" font-family="'Bebas Neue', 'Noto Sans SC', sans-serif">2</text>
    <text x="1516" y="702" fill="#8C9BB5" font-size="24">天新人上手</text>
