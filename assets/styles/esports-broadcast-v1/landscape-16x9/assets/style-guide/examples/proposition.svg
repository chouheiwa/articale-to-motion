  <text x="990" y="540" fill="#F2F5FA" font-size="210" font-family="'Bebas Neue', 'Noto Sans SC', sans-serif">3.2X</text>
  <text x="1400" y="462" fill="#F2F5FA" font-size="34" font-weight="700" font-family="'Noto Sans SC', sans-serif">上线速度</text>
  <text x="1400" y="508" fill="#8C9BB5" font-size="26" font-family="'Noto Sans SC', sans-serif">对比同规模微服务团队</text>
  <rect x="996" y="576" width="728" height="2" fill="#26314A"/>

  <g font-family="'Noto Sans SC', sans-serif">
    <text x="996" y="664" fill="#F2F5FA" font-size="76" font-family="'Bebas Neue', 'Noto Sans SC', sans-serif">12</text>
