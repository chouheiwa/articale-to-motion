<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <pattern id="stripes" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(16)">
      <rect width="8" height="24" fill="#26314A"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="#0B0F1A"/>

  <!-- background layer -->
  <path d="M48 1040 V760 L380 1040 Z" fill="url(#stripes)" opacity="0.4"/>
  <path d="M1872 196 V860 L1540 196 Z" fill="#141B2D" opacity="0.7"/>
  <g fill="none" stroke="#26314A" stroke-width="3">
    <path d="M48 100 V40 H108"/>
    <path d="M1812 40 H1872 V100"/>
    <path d="M1812 1040 H1872 V980"/>
  </g>

  <!-- header -->
  <path d="M175 104 H334 L319 156 H160 Z" fill="#141B2D"/>
  <path d="M175 104 H187 L172 156 H160 Z" fill="#2F8CFF"/>
  <text x="198" y="141" fill="#F2F5FA" font-size="28" font-weight="700" font-family="'Noto Sans SC', sans-serif" letter-spacing="2">积分榜</text>
  <rect x="1658" y="108" width="102" height="44" rx="22" fill="none" stroke="#3DDC84" stroke-width="2"/>
  <text x="1709" y="141" text-anchor="middle" fill="#3DDC84" font-size="30" font-family="'Bebas Neue', 'Noto Sans SC', sans-serif" letter-spacing="2">FINAL</text>
  <rect x="160" y="176" width="1600" height="2" fill="#26314A"/>
  <rect x="160" y="176" width="260" height="2" fill="#2F8CFF"/>

  <!-- left column -->
  <g font-family="'Noto Sans SC', sans-serif">
