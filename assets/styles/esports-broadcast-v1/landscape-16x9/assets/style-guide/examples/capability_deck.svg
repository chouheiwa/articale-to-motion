    <text x="160" y="340" fill="#8C9BB5" font-size="26">场景：10 人团队，日活 5 万</text>

    <text x="160" y="428" fill="#8C9BB5" font-size="24" font-weight="600">评分口径</text>
    <rect x="160" y="444" width="560" height="2" fill="#26314A"/>

    <text x="160" y="498" fill="#F2F5FA" font-size="28" font-weight="600">上线速度</text>
    <text x="720" y="500" text-anchor="end" fill="#F2F5FA" font-size="44" font-family="'Bebas Neue', 'Noto Sans SC', sans-serif">30%</text>
    <rect x="160" y="514" width="560" height="6" fill="#26314A"/>
    <rect x="160" y="514" width="168" height="6" fill="#8C9BB5"/>

    <text x="160" y="572" fill="#F2F5FA" font-size="28" font-weight="600">运维成本</text>
    <text x="720" y="574" text-anchor="end" fill="#F2F5FA" font-size="44" font-family="'Bebas Neue', 'Noto Sans SC', sans-serif">30%</text>
    <rect x="160" y="588" width="560" height="6" fill="#26314A"/>
    <rect x="160" y="588" width="168" height="6" fill="#8C9BB5"/>

    <text x="160" y="646" fill="#F2F5FA" font-size="28" font-weight="600">扩展性</text>
    <text x="720" y="648" text-anchor="end" fill="#F2F5FA" font-size="44" font-family="'Bebas Neue', 'Noto Sans SC', sans-serif">40%</text>
    <rect x="160" y="662" width="560" height="6" fill="#26314A"/>
    <rect x="160" y="662" width="224" height="6" fill="#8C9BB5"/>
  </g>

  <!-- lower third -->
  <path d="M160 684 H740 L720 756 H160 Z" fill="#141B2D"/>
  <rect x="160" y="684" width="10" height="72" fill="#2F8CFF"/>
  <text x="194" y="731" fill="#F2F5FA" font-size="32" font-weight="700" font-family="'Noto Sans SC', sans-serif">冠军：模块化单体</text>
  <text x="692" y="730" text-anchor="end" fill="#2F8CFF" font-size="28" font-family="'Bebas Neue', 'Noto Sans SC', sans-serif" letter-spacing="3">CHAMPION</text>

  <!-- leaderboard -->
  <g font-family="'Noto Sans SC', sans-serif">
    <text x="816" y="236" fill="#8C9BB5" font-size="24">名次</text>
    <text x="920" y="236" fill="#8C9BB5" font-size="24">方案</text>
    <text x="1730" y="236" text-anchor="end" fill="#8C9BB5" font-size="24">综合得分</text>
    <rect x="800" y="252" width="960" height="2" fill="#26314A"/>

    <!-- row 1 -->
    <g transform="translate(0 268)">
      <path d="M800 0 H1760 V88 H800 Z" fill="#141B2D" stroke="#FFC23D" stroke-width="2"/>
      <path d="M833 14 H892 L878 74 H819 Z" fill="#FFC23D"/>
      <text x="855" y="66" text-anchor="middle" fill="#0B0F1A" font-size="56" font-family="'Bebas Neue', 'Noto Sans SC', sans-serif">1</text>
      <text x="920" y="42" fill="#F2F5FA" font-size="34" font-weight="700">模块化单体</text>
      <rect x="920" y="58" width="600" height="10" fill="#26314A"/>
      <rect x="920" y="58" width="552" height="10" fill="#FFC23D"/>
      <text x="1730" y="72" text-anchor="end" fill="#F2F5FA" font-size="76" font-family="'Bebas Neue', 'Noto Sans SC', sans-serif">92</text>
    </g>
    <!-- row 2 -->
    <g transform="translate(0 368)">
      <path d="M800 0 H1760 V88 H800 Z" fill="#141B2D" stroke="#2F8CFF" stroke-width="2"/>
      <path d="M833 14 H892 L878 74 H819 Z" fill="none" stroke="#26314A" stroke-width="2"/>
      <text x="855" y="66" text-anchor="middle" fill="#8C9BB5" font-size="52" font-family="'Bebas Neue', 'Noto Sans SC', sans-serif">2</text>
      <text x="920" y="42" fill="#F2F5FA" font-size="32" font-weight="600">单体</text>
      <rect x="920" y="58" width="600" height="10" fill="#26314A"/>
      <rect x="920" y="58" width="510" height="10" fill="#2F8CFF"/>
      <text x="1730" y="70" text-anchor="end" fill="#F2F5FA" font-size="64" font-family="'Bebas Neue', 'Noto Sans SC', sans-serif">85</text>
    </g>
    <!-- row 3 -->
    <g transform="translate(0 468)">
      <path d="M800 0 H1760 V88 H800 Z" fill="#141B2D" stroke="#FF3B4E" stroke-width="2"/>
      <path d="M833 14 H892 L878 74 H819 Z" fill="none" stroke="#26314A" stroke-width="2"/>
      <text x="855" y="66" text-anchor="middle" fill="#8C9BB5" font-size="52" font-family="'Bebas Neue', 'Noto Sans SC', sans-serif">3</text>
      <text x="920" y="42" fill="#F2F5FA" font-size="32" font-weight="600">微服务</text>
      <rect x="920" y="58" width="600" height="10" fill="#26314A"/>
      <rect x="920" y="58" width="468" height="10" fill="#FF3B4E"/>
      <text x="1730" y="70" text-anchor="end" fill="#F2F5FA" font-size="64" font-family="'Bebas Neue', 'Noto Sans SC', sans-serif">78</text>
    </g>
    <!-- row 4 -->
    <g transform="translate(0 568)">
      <path d="M800 0 H1760 V88 H800 Z" fill="#141B2D"/>
      <path d="M833 14 H892 L878 74 H819 Z" fill="none" stroke="#26314A" stroke-width="2"/>
      <text x="855" y="66" text-anchor="middle" fill="#8C9BB5" font-size="52" font-family="'Bebas Neue', 'Noto Sans SC', sans-serif">4</text>
      <text x="920" y="42" fill="#F2F5FA" font-size="32" font-weight="600">Serverless</text>
      <rect x="920" y="58" width="600" height="10" fill="#26314A"/>
      <rect x="920" y="58" width="426" height="10" fill="#8C9BB5"/>
      <text x="1730" y="70" text-anchor="end" fill="#8C9BB5" font-size="64" font-family="'Bebas Neue', 'Noto Sans SC', sans-serif">71</text>
    </g>
    <!-- row 5 -->
    <g transform="translate(0 668)">
      <path d="M800 0 H1760 V88 H800 Z" fill="#141B2D"/>
      <path d="M833 14 H892 L878 74 H819 Z" fill="none" stroke="#26314A" stroke-width="2"/>
      <text x="855" y="66" text-anchor="middle" fill="#8C9BB5" font-size="52" font-family="'Bebas Neue', 'Noto Sans SC', sans-serif">5</text>
      <text x="920" y="42" fill="#F2F5FA" font-size="32" font-weight="600">服务网格</text>
      <rect x="920" y="58" width="600" height="10" fill="#26314A"/>
      <rect x="920" y="58" width="384" height="10" fill="#8C9BB5"/>
      <text x="1730" y="70" text-anchor="end" fill="#8C9BB5" font-size="64" font-family="'Bebas Neue', 'Noto Sans SC', sans-serif">64</text>
    </g>
