<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#16304A" stroke-width="1"/>
    </pattern>
    <radialGradient id="vignette" cx="0.5" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#0F2233" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0A1622"/>
    </radialGradient>
    <radialGradient id="earth" cx="0.5" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#132C40"/>
      <stop offset="1" stop-color="#0A1622"/>
    </radialGradient>
    <clipPath id="earthClip"><circle cx="540" cy="2140" r="700"/></clipPath>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1080" height="1920" fill="#0A1622"/>
  <rect width="1080" height="1920" fill="url(#vignette)"/>
  <rect width="1080" height="1920" fill="url(#grid)" opacity="0.8"/>

  <!-- edge ruler -->
  <g stroke="#2E5A73" stroke-width="1">
    <path d="M52 240h10M52 280h10M52 320h10M52 360h18M52 400h10M52 440h10M52 480h10M52 520h10M52 560h18M52 600h10M52 640h10M52 680h10M52 720h10M52 760h18M52 800h10M52 840h10M52 880h10M52 920h10M52 960h18M52 1000h10M52 1040h10M52 1080h10M52 1120h10M52 1160h18M52 1200h10M52 1240h10M52 1280h10"/>
  </g>

  <!-- earth & orbit -->
  <circle cx="540" cy="2140" r="700" fill="url(#earth)" stroke="#3FE0F0" stroke-opacity="0.55" stroke-width="2"/>
  <g clip-path="url(#earthClip)" fill="none" stroke="#2E5A73" stroke-width="1.5">
    <ellipse cx="540" cy="2140" rx="200" ry="700"/>
    <ellipse cx="540" cy="2140" rx="440" ry="700"/>
    <path d="M0 1560H1080M0 1680H1080"/>
  </g>
  <circle cx="540" cy="2140" r="840" fill="none" stroke="#3FE0F0" stroke-width="2" stroke-dasharray="14 10" opacity="0.8"/>
  <text x="690" y="1404" fill="#8FB3C4" font-size="20" font-weight="700" letter-spacing="3" font-family="'Orbitron', 'Noto Sans SC', sans-serif">LEO 550 KM</text>

  <!-- header -->
  <g>
    <rect x="88" y="130" width="14" height="14" fill="#37D6B5"/>
    <text x="116" y="146" fill="#3FE0F0" font-size="28" font-weight="700" letter-spacing="4" font-family="'Noto Sans SC', sans-serif">目标锁定</text>
    <text x="900" y="145" text-anchor="end" fill="#8FB3C4" font-size="20" font-weight="700" letter-spacing="4" font-family="'Orbitron', 'Noto Sans SC', sans-serif">TGT-01 · LOCK</text>
    <rect x="88" y="176" width="812" height="2" fill="#2E5A73"/>
    <rect x="88" y="176" width="240" height="2" fill="#3FE0F0"/>
    <path d="M900 170v14" stroke="#3FE0F0" stroke-width="2"/>
  </g>

  <!-- title (focus 1) -->
  <g font-family="'Noto Sans SC', sans-serif">
    <path d="M88 290h128l14 14v34H88z" fill="#0F3A48" stroke="#3FE0F0" stroke-width="2"/>
    <text x="104" y="327" fill="#3FE0F0" font-size="22" font-weight="700" letter-spacing="3" font-family="'Orbitron', 'Noto Sans SC', sans-serif">Q-001</text>
    <text x="88" y="476" fill="#E6F6FA" font-size="104" font-weight="900">卫星为什么</text>
    <text x="88" y="594" fill="#3FE0F0" font-size="104" font-weight="900">不会掉下来？</text>
    <rect x="88" y="632" width="80" height="4" fill="#3FE0F0"/>
    <text x="88" y="700" fill="#8FB3C4" font-size="32" font-weight="400">它一直在下落，只是永远落不到地面。</text>
  </g>

  <!-- supporting telemetry strip -->
  <g>
    <path d="M88 800h812v150H108l-20-20z" fill="#0F2233" stroke="#2E5A73" stroke-width="2"/>
    <path d="M494 822v106" stroke="#2E5A73" stroke-width="2"/>
    <text x="120" y="846" fill="#8FB3C4" font-size="18" font-weight="700" letter-spacing="3" font-family="'Orbitron', 'Noto Sans SC', sans-serif">FORWARD</text>
    <text x="120" y="908" fill="#E6F6FA" font-size="30" font-weight="600" font-family="'Noto Sans SC', sans-serif">每向前飞 <tspan fill="#3FE0F0" font-weight="700" font-family="'Orbitron', 'Noto Sans SC', sans-serif">8 KM</tspan></text>
    <text x="526" y="846" fill="#8FB3C4" font-size="18" font-weight="700" letter-spacing="3" font-family="'Orbitron', 'Noto Sans SC', sans-serif">CURVATURE</text>
    <text x="526" y="908" fill="#E6F6FA" font-size="30" font-weight="600" font-family="'Noto Sans SC', sans-serif">地面就弯下 <tspan fill="#3FE0F0" font-weight="700" font-family="'Orbitron', 'Noto Sans SC', sans-serif">5 M</tspan></text>
  </g>

  <!-- velocity panel -->
  <g font-family="'Orbitron', 'Noto Sans SC', sans-serif" font-weight="700">
    <path d="M640 1110h260v96H660l-20-20z" fill="#0F2233" stroke="#2E5A73" stroke-width="2"/>
    <text x="664" y="1146" fill="#8FB3C4" font-size="18" letter-spacing="3">VELOCITY</text>
    <text x="664" y="1190" fill="#E6F6FA" font-size="32" letter-spacing="1">7.6<tspan fill="#3FE0F0" font-size="20" dx="8">KM/S</tspan></text>
  </g>

  <!-- target reticle (focus 2) -->
  <g transform="translate(200 1372)">
    <g filter="url(#glow)" fill="none" stroke="#3FE0F0" stroke-width="3">
      <path d="M-86 -52v-34h34 M86 -52v-34h-34 M-86 52v34h34 M86 52v34h-34"/>
      <circle r="50" stroke-width="2"/>
      <path d="M0 -72v-20 M0 72v20 M-72 0h-20 M72 0h20" stroke-width="2"/>
    </g>
    <rect x="-13" y="-10" width="26" height="20" fill="#E6F6FA"/>
    <rect x="-44" y="-6" width="27" height="12" fill="#3FE0F0"/>
    <rect x="17" y="-6" width="27" height="12" fill="#3FE0F0"/>
    <path d="M96 -34L220 -92" stroke="#3FE0F0" stroke-width="3"/>
    <path d="M220 -92l-22 0 9 15z" fill="#3FE0F0"/>
    <path d="M34 80L64 140" stroke="#8FB3C4" stroke-width="3"/>
    <path d="M64 140l-14-12 14-6z" fill="#8FB3C4"/>
    <text x="80" y="142" fill="#8FB3C4" font-size="24" font-weight="600" font-family="'Noto Sans SC', sans-serif">引力</text>
    <path d="M-86 -100h92v-28h-92z" fill="#37D6B5"/>
    <text x="-76" y="-107" fill="#0A1622" font-size="18" font-weight="700" letter-spacing="3" font-family="'Orbitron', 'Noto Sans SC', sans-serif">LOCK</text>
  </g>

  <!-- frame + footer -->
  <g fill="none" stroke="#3FE0F0" stroke-opacity="0.6" stroke-width="2">
    <path d="M40 150V96h54 M1040 150V96h-54 M40 1806v54h54 M1040 1806v54h-54"/>
  </g>
  <rect x="80" y="1764" width="244" height="34" fill="#0A1622" opacity="0.85"/>
  <rect x="846" y="1764" width="156" height="34" fill="#0A1622" opacity="0.85"/>
  <g font-family="'Orbitron', 'Noto Sans SC', sans-serif" font-weight="700" font-size="18" letter-spacing="3">
    <rect x="88" y="1778" width="10" height="10" fill="#37D6B5"/>
    <text x="110" y="1788" fill="#8FB3C4">ORBIT NOMINAL</text>
    <text x="992" y="1788" text-anchor="end" fill="#8FB3C4">T+00:42:17</text>
  </g>
</svg>
