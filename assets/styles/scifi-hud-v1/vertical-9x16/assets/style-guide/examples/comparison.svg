<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#16304A" stroke-width="1"/>
    </pattern>
    <radialGradient id="vignette" cx="0.5" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#0F2233" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0A1622"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3FE0F0" stop-opacity="0"/>
      <stop offset="1" stop-color="#3FE0F0" stop-opacity="0.22"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1080" height="1920" fill="#0A1622"/>
  <rect width="1080" height="1920" fill="url(#vignette)"/>
  <rect width="1080" height="1920" fill="url(#grid)" opacity="0.8"/>

  <!-- header -->
  <g>
    <rect x="88" y="130" width="14" height="14" fill="#37D6B5"/>
    <text x="116" y="146" fill="#3FE0F0" font-size="28" font-weight="700" letter-spacing="4" font-family="'Noto Sans SC', sans-serif">扫描对比</text>
    <text x="900" y="145" text-anchor="end" fill="#8FB3C4" font-size="20" font-weight="700" letter-spacing="4" font-family="'Orbitron', 'Noto Sans SC', sans-serif">SCAN · A / B</text>
    <rect x="88" y="176" width="812" height="2" fill="#2E5A73"/>
    <rect x="88" y="176" width="240" height="2" fill="#3FE0F0"/>
  </g>
  <text x="88" y="280" fill="#E6F6FA" font-size="62" font-weight="700" font-family="'Noto Sans SC', sans-serif">低轨还是高轨？</text>
  <text x="88" y="338" fill="#8FB3C4" font-size="30" font-weight="400" font-family="'Noto Sans SC', sans-serif">同一颗通信卫星，放在两个不同高度</text>

  <!-- window A -->
  <g>
    <rect x="88" y="392" width="396" height="708" fill="#0F2233"/>
    <path d="M88 430v-38h38 M484 430v-38h-38 M88 1062v38h38 M484 1062v38h-38" fill="none" stroke="#3FE0F0" stroke-width="3"/>
    <text x="112" y="444" fill="#3FE0F0" font-size="22" font-weight="700" letter-spacing="3" font-family="'Orbitron', 'Noto Sans SC', sans-serif">A · LEO</text>
    <text x="460" y="444" text-anchor="end" fill="#8FB3C4" font-size="24" font-weight="600" font-family="'Noto Sans SC', sans-serif">近地轨道</text>
    <circle cx="286" cy="610" r="96" fill="#132C40" stroke="#3FE0F0" stroke-opacity="0.6" stroke-width="2"/>
    <ellipse cx="286" cy="610" rx="40" ry="96" fill="none" stroke="#2E5A73" stroke-width="1.5"/>
    <path d="M190 610h192" stroke="#2E5A73" stroke-width="1.5"/>
    <circle cx="286" cy="610" r="122" fill="none" stroke="#3FE0F0" stroke-width="2" stroke-dasharray="8 6"/>
    <rect x="372" y="516" width="16" height="16" fill="#E6F6FA" transform="rotate(45 380 524)"/>
  </g>
  <!-- window B -->
  <g>
    <rect x="504" y="392" width="396" height="708" fill="#0F2233"/>
    <path d="M504 430v-38h38 M900 430v-38h-38 M504 1062v38h38 M900 1062v38h-38" fill="none" stroke="#3FE0F0" stroke-width="3"/>
    <text x="528" y="444" fill="#3FE0F0" font-size="22" font-weight="700" letter-spacing="3" font-family="'Orbitron', 'Noto Sans SC', sans-serif">B · GEO</text>
    <text x="876" y="444" text-anchor="end" fill="#8FB3C4" font-size="24" font-weight="600" font-family="'Noto Sans SC', sans-serif">静止轨道</text>
    <circle cx="702" cy="610" r="22" fill="#132C40" stroke="#3FE0F0" stroke-opacity="0.6" stroke-width="2"/>
    <circle cx="702" cy="610" r="134" fill="none" stroke="#3FE0F0" stroke-width="2" stroke-dasharray="8 6"/>
    <rect x="828" y="553" width="16" height="16" fill="#E6F6FA" transform="rotate(45 836 561)"/>
    <path d="M702 610L836 561" stroke="#2E5A73" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <!-- readout rows -->
  <g font-family="'Noto Sans SC', sans-serif" font-size="26" fill="#8FB3C4">
    <path d="M112 822H460M528 822H876M112 906H460M528 906H876M112 990H460M528 990H876" stroke="#2E5A73" stroke-width="1"/>
    <text x="112" y="806">轨道高度</text>
    <text x="528" y="806">轨道高度</text>
    <text x="112" y="890">绕地一周</text>
    <text x="528" y="890">绕地一周</text>
    <text x="112" y="1046">全球覆盖</text>
    <text x="528" y="1046">全球覆盖</text>
  </g>
  <g font-family="'Orbitron', 'Noto Sans SC', sans-serif" font-weight="700" font-size="26" fill="#E6F6FA" text-anchor="end">
    <text x="460" y="806">550 KM</text>
    <text x="876" y="806">35786 KM</text>
    <text x="460" y="890">95 MIN</text>
    <text x="876" y="890">23 H 56 M</text>
  </g>
  <g font-family="'Noto Sans SC', sans-serif" font-weight="600" font-size="26" fill="#E6F6FA" text-anchor="end">
    <text x="460" y="1046">上千颗</text>
    <text x="876" y="1046">约 3 颗</text>
  </g>

  <!-- highlighted row with scan line (focus) -->
  <rect x="88" y="930" width="812" height="52" fill="url(#scan)"/>
  <rect x="100" y="926" width="372" height="58" fill="#132C40" stroke="#3FE0F0" stroke-width="2"/>
  <rect x="516" y="926" width="372" height="58" fill="#132C40" stroke="#FFB547" stroke-width="2"/>
  <text x="112" y="965" fill="#E6F6FA" font-size="26" font-weight="600" font-family="'Noto Sans SC', sans-serif">单跳时延</text>
  <text x="528" y="965" fill="#E6F6FA" font-size="26" font-weight="600" font-family="'Noto Sans SC', sans-serif">单跳时延</text>
  <text x="460" y="967" text-anchor="end" fill="#3FE0F0" font-size="30" font-weight="700" font-family="'Orbitron', 'Noto Sans SC', sans-serif">≈ 4 MS</text>
  <text x="876" y="967" text-anchor="end" fill="#FFB547" font-size="30" font-weight="700" font-family="'Orbitron', 'Noto Sans SC', sans-serif">≈ 240 MS</text>
  <path d="M60 986H1020" stroke="#3FE0F0" stroke-width="2" filter="url(#glow)"/>
  <path d="M60 978v16M1020 978v16" stroke="#3FE0F0" stroke-width="2"/>

  <!-- conclusion bar -->
  <g>
    <path d="M88 1136h812v96H108l-20-20z" fill="#0F2233" stroke="#37D6B5" stroke-width="2"/>
    <rect x="88" y="1136" width="8" height="76" fill="#37D6B5"/>
    <text x="118" y="1194" fill="#37D6B5" font-size="22" font-weight="700" letter-spacing="3" font-family="'Orbitron', 'Noto Sans SC', sans-serif">RESULT</text>
    <text x="252" y="1196" fill="#E6F6FA" font-size="30" font-weight="600" font-family="'Noto Sans SC', sans-serif">低轨换来低时延，代价是更多卫星</text>
  </g>

  <!-- lower background: altitude horizon -->
  <g fill="none">
    <circle cx="540" cy="2560" r="900" fill="#0F2233" stroke="#3FE0F0" stroke-opacity="0.45" stroke-width="2"/>
    <circle cx="540" cy="2560" r="960" stroke="#3FE0F0" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="10 8"/>
    <circle cx="540" cy="2560" r="1140" stroke="#2E5A73" stroke-width="2" stroke-dasharray="10 8"/>
    <path d="M540 1420v200" stroke="#2E5A73" stroke-width="1.5"/>
    <path d="M530 1420h20M530 1600h20M530 1660h20" stroke="#2E5A73" stroke-width="1.5"/>
  </g>
  <g font-family="'Orbitron', 'Noto Sans SC', sans-serif" font-weight="700" font-size="18" letter-spacing="3" fill="#8FB3C4">
    <text x="560" y="1636">LEO</text>
    <text x="560" y="1474">GEO</text>
  </g>

  <g fill="none" stroke="#3FE0F0" stroke-opacity="0.6" stroke-width="2">
    <path d="M40 150V96h54 M1040 150V96h-54 M40 1806v54h54 M1040 1806v54h-54"/>
  </g>
  <rect x="80" y="1764" width="330" height="34" fill="#0F2233" opacity="0.9"/>
  <rect x="890" y="1764" width="112" height="34" fill="#0F2233" opacity="0.9"/>
  <g font-family="'Orbitron', 'Noto Sans SC', sans-serif" font-weight="700" font-size="18" letter-spacing="3">
    <rect x="88" y="1778" width="10" height="10" fill="#37D6B5"/>
    <text x="110" y="1788" fill="#8FB3C4">2 TARGETS SCANNED</text>
    <text x="992" y="1788" text-anchor="end" fill="#8FB3C4">CH 02</text>
  </g>
</svg>
