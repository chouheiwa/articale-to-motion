<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#16304A" stroke-width="1"/>
    </pattern>
    <radialGradient id="vignette" cx="0.5" cy="0.4" r="0.75">
      <stop offset="0" stop-color="#0F2233" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0A1622"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3FE0F0" stop-opacity="0"/>
      <stop offset="1" stop-color="#3FE0F0" stop-opacity="0.22"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1080" height="1440" fill="#0A1622"/>
  <rect width="1080" height="1440" fill="url(#vignette)"/>
  <rect width="1080" height="1440" fill="url(#grid)" opacity="0.8"/>

  <g fill="none" stroke="#2E5A73" stroke-width="2">
    <path d="M40 150V96h54 M1040 150V96h-54 M40 1326v54h54 M1040 1326v54h-54"/>
  </g>

  <!-- header -->
  <g>
    <rect x="88" y="130" width="14" height="14" fill="#37D6B5"/>
    <text x="116" y="146" fill="#3FE0F0" font-size="28" font-weight="700" letter-spacing="4" font-family="'Noto Sans SC', sans-serif">扫描对比</text>
    <text x="900" y="145" text-anchor="end" fill="#8FB3C4" font-size="20" font-weight="700" letter-spacing="4" font-family="'Orbitron', 'Noto Sans SC', sans-serif">SCAN · A / B</text>
    <rect x="88" y="176" width="812" height="2" fill="#2E5A73"/>
    <rect x="88" y="176" width="240" height="2" fill="#3FE0F0"/>
  </g>
  <text x="88" y="262" fill="#E6F6FA" font-size="56" font-weight="700" font-family="'Noto Sans SC', sans-serif">低轨还是高轨？</text>
  <text x="88" y="310" fill="#8FB3C4" font-size="28" font-weight="400" font-family="'Noto Sans SC', sans-serif">同一颗通信卫星，放在两个不同高度</text>

  <!-- window A -->
  <g>
    <rect x="88" y="344" width="396" height="516" fill="#0F2233"/>
    <path d="M88 380v-36h36 M484 380v-36h-36 M88 824v36h36 M484 824v36h-36" fill="none" stroke="#3FE0F0" stroke-width="3"/>
    <text x="112" y="392" fill="#3FE0F0" font-size="22" font-weight="700" letter-spacing="3" font-family="'Orbitron', 'Noto Sans SC', sans-serif">A · LEO</text>
    <text x="460" y="392" text-anchor="end" fill="#8FB3C4" font-size="24" font-weight="600" font-family="'Noto Sans SC', sans-serif">近地轨道</text>
    <circle cx="286" cy="500" r="64" fill="#132C40" stroke="#3FE0F0" stroke-opacity="0.6" stroke-width="2"/>
    <ellipse cx="286" cy="500" rx="26" ry="64" fill="none" stroke="#2E5A73" stroke-width="1.5"/>
    <circle cx="286" cy="500" r="82" fill="none" stroke="#3FE0F0" stroke-width="2" stroke-dasharray="8 6"/>
    <rect x="345" y="436" width="14" height="14" fill="#E6F6FA" transform="rotate(45 352 443)"/>
  </g>
  <!-- window B -->
  <g>
    <rect x="504" y="344" width="396" height="516" fill="#0F2233"/>
    <path d="M504 380v-36h36 M900 380v-36h-36 M504 824v36h36 M900 824v36h-36" fill="none" stroke="#3FE0F0" stroke-width="3"/>
    <text x="528" y="392" fill="#3FE0F0" font-size="22" font-weight="700" letter-spacing="3" font-family="'Orbitron', 'Noto Sans SC', sans-serif">B · GEO</text>
    <text x="876" y="392" text-anchor="end" fill="#8FB3C4" font-size="24" font-weight="600" font-family="'Noto Sans SC', sans-serif">静止轨道</text>
    <circle cx="702" cy="500" r="16" fill="#132C40" stroke="#3FE0F0" stroke-opacity="0.6" stroke-width="2"/>
    <circle cx="702" cy="500" r="92" fill="none" stroke="#3FE0F0" stroke-width="2" stroke-dasharray="8 6"/>
    <rect x="787" y="458" width="14" height="14" fill="#E6F6FA" transform="rotate(45 794 465)"/>
    <path d="M702 500L794 465" stroke="#2E5A73" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <!-- readout rows -->
  <g font-family="'Noto Sans SC', sans-serif" font-size="24" fill="#8FB3C4">
    <path d="M112 634H460M528 634H876M112 698H460M528 698H876M112 762H460M528 762H876" stroke="#2E5A73" stroke-width="1"/>
    <text x="112" y="620">轨道高度</text>
    <text x="528" y="620">轨道高度</text>
    <text x="112" y="684">绕地一周</text>
    <text x="528" y="684">绕地一周</text>
    <text x="112" y="812">全球覆盖</text>
    <text x="528" y="812">全球覆盖</text>
  </g>
  <g font-family="'Orbitron', 'Noto Sans SC', sans-serif" font-weight="700" font-size="24" fill="#E6F6FA" text-anchor="end">
    <text x="460" y="620">550 KM</text>
    <text x="876" y="620">35786 KM</text>
    <text x="460" y="684">95 MIN</text>
    <text x="876" y="684">23 H 56 M</text>
  </g>
  <g font-family="'Noto Sans SC', sans-serif" font-weight="600" font-size="24" fill="#E6F6FA" text-anchor="end">
    <text x="460" y="812">上千颗</text>
    <text x="876" y="812">约 3 颗</text>
  </g>

  <!-- highlighted row with scan line (focus) -->
  <rect x="88" y="708" width="812" height="48" fill="url(#scan)"/>
  <rect x="100" y="706" width="372" height="52" fill="#132C40" stroke="#3FE0F0" stroke-width="2"/>
  <rect x="516" y="706" width="372" height="52" fill="#132C40" stroke="#FFB547" stroke-width="2"/>
  <text x="112" y="742" fill="#E6F6FA" font-size="24" font-weight="600" font-family="'Noto Sans SC', sans-serif">单跳时延</text>
  <text x="528" y="742" fill="#E6F6FA" font-size="24" font-weight="600" font-family="'Noto Sans SC', sans-serif">单跳时延</text>
  <text x="460" y="744" text-anchor="end" fill="#3FE0F0" font-size="28" font-weight="700" font-family="'Orbitron', 'Noto Sans SC', sans-serif">≈ 4 MS</text>
  <text x="876" y="744" text-anchor="end" fill="#FFB547" font-size="28" font-weight="700" font-family="'Orbitron', 'Noto Sans SC', sans-serif">≈ 240 MS</text>
  <path d="M60 760H1020" stroke="#3FE0F0" stroke-width="2" filter="url(#glow)"/>
  <path d="M60 752v16M1020 752v16" stroke="#3FE0F0" stroke-width="2"/>

  <!-- conclusion bar -->
  <g>
    <path d="M88 888h812v84H108l-20-20z" fill="#0F2233" stroke="#37D6B5" stroke-width="2"/>
    <rect x="88" y="888" width="8" height="64" fill="#37D6B5"/>
    <text x="118" y="941" fill="#37D6B5" font-size="22" font-weight="700" letter-spacing="3" font-family="'Orbitron', 'Noto Sans SC', sans-serif">RESULT</text>
    <text x="252" y="942" fill="#E6F6FA" font-size="28" font-weight="600" font-family="'Noto Sans SC', sans-serif">低轨换来低时延，代价是更多卫星</text>
  </g>

  <!-- lower background: altitude horizon -->
  <g fill="none">
    <circle cx="540" cy="2040" r="820" fill="#0F2233" stroke="#3FE0F0" stroke-opacity="0.45" stroke-width="2"/>
    <circle cx="540" cy="2040" r="880" stroke="#3FE0F0" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="10 8"/>
    <circle cx="540" cy="2040" r="1010" stroke="#2E5A73" stroke-width="2" stroke-dasharray="10 8"/>
  </g>
  <g font-family="'Orbitron', 'Noto Sans SC', sans-serif" font-weight="700" font-size="18" letter-spacing="3" fill="#8FB3C4">
    <text x="540" y="1194" text-anchor="middle">LEO</text>
    <text x="540" y="1066" text-anchor="middle">GEO</text>
  </g>
  <!-- lower background: range scale -->
  <g stroke="#2E5A73" stroke-width="1">
    <path d="M88 1270H992"/>
    <path d="M88 1260v20M178 1264v12M268 1264v12M358 1264v12M448 1264v12M540 1260v20M630 1264v12M720 1264v12M810 1264v12M900 1264v12M992 1260v20"/>
  </g>
  <g font-family="'Orbitron', 'Noto Sans SC', sans-serif" font-weight="700" font-size="18" letter-spacing="3">
    <rect x="88" y="1298" width="10" height="10" fill="#37D6B5"/>
    <text x="110" y="1308" fill="#8FB3C4">2 TARGETS SCANNED</text>
    <text x="992" y="1308" text-anchor="end" fill="#8FB3C4">CH 02</text>
  </g>
</svg>
