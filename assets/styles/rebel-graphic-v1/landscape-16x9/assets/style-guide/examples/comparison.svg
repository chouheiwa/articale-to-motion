  <text x="196" y="492" fill="#F4F1EA" font-size="40" font-weight="700" font-family="'Noto Sans SC', sans-serif">摘抄式笔记</text>
  <text x="196" y="554" fill="#B9B4AA" font-size="30" font-family="'Noto Sans SC', sans-serif">抄得很全，合上本子就忘。</text>
  <text x="196" y="602" fill="#B9B4AA" font-size="30" font-family="'Noto Sans SC', sans-serif">输入很多，输出为零。</text>
