  <text x="124" y="592" fill="#B9B4AA" font-size="30" font-family="'Noto Sans SC', sans-serif">抄得很全，合上本子就忘。</text>
  <text x="124" y="642" fill="#B9B4AA" font-size="30" font-family="'Noto Sans SC', sans-serif">看着努力，其实没过脑。</text>
