  <text x="124" y="1178" fill="#111111" font-size="40" font-weight="700" font-family="'Noto Sans SC', sans-serif">费曼式笔记</text>
  <text x="124" y="1232" fill="#6E6A63" font-size="30" font-family="'Noto Sans SC', sans-serif">用自己的话重讲，卡点即盲点。</text>
  <text x="124" y="1282" fill="#6E6A63" font-size="30" font-family="'Noto Sans SC', sans-serif">慢一点，但每一步都过脑。</text>
