    <radialGradient id="fadeRad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fadeMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.65" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1920" fill="#111111"/>
  <mask id="m1"><rect x="560" y="340" width="520" height="944" fill="url(#fadeRad)"/></mask>
  <rect x="560" y="340" width="520" height="944" fill="url(#dots)" mask="url(#m1)"/>
  <polygon points="0,1480 1080,1250 1080,1276 0,1506" fill="#D8152F"/>
