      <circle cx="9" cy="9" r="3.6" fill="#2A2A2A"/>
    </pattern>
    <pattern id="dotsRed" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(-15)">
      <circle cx="8" cy="8" r="3.2" fill="#9E0F22"/>
    </pattern>
    <linearGradient id="fadeDown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeUp" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
