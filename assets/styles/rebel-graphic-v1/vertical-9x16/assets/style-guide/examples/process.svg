  <text x="88" y="340" fill="#F4F1EA" font-size="64" font-family="'ZCOOL QingKe HuangYou', 'Noto Sans SC', sans-serif">费曼笔记 · 四步走</text>
  <polygon points="114,420 740,420 714,580 88,580" fill="#2A2A2A"/>
  <text x="136" y="516" fill="#B9B4AA" font-size="44" font-family="'Bungee', 'Noto Sans SC', sans-serif">01</text>
  <text x="250" y="516" fill="#F4F1EA" font-size="38" font-weight="700" font-family="'Noto Sans SC', sans-serif">选一个概念</text>
  <polygon points="114,616 820,616 794,776 88,776" fill="#FFE14A"/>
  <polygon points="836,670 880,696 836,722" fill="#FFE14A"/>
  <rect x="88" y="782" width="700" height="8" fill="#D8152F"/>
  <text x="136" y="712" fill="#111111" font-size="44" font-family="'Bungee', 'Noto Sans SC', sans-serif">02</text>
  <text x="250" y="712" fill="#111111" font-size="44" font-weight="700" font-family="'Noto Sans SC', sans-serif">讲给外行听</text>
  <polygon points="114,812 740,812 714,972 88,972" fill="#2A2A2A"/>
  <text x="136" y="908" fill="#B9B4AA" font-size="44" font-family="'Bungee', 'Noto Sans SC', sans-serif">03</text>
  <text x="250" y="908" fill="#F4F1EA" font-size="38" font-weight="700" font-family="'Noto Sans SC', sans-serif">标出卡壳处</text>
  <polygon points="114,1008 740,1008 714,1168 88,1168" fill="#2A2A2A"/>
  <text x="136" y="1104" fill="#B9B4AA" font-size="44" font-family="'Bungee', 'Noto Sans SC', sans-serif">04</text>
  <text x="250" y="1104" fill="#F4F1EA" font-size="38" font-weight="700" font-family="'Noto Sans SC', sans-serif">简化后重讲</text>
  <polygon points="88,1230 868,1230 900,1262 900,1520 88,1520" fill="#F4F1EA"/>
  <rect x="88" y="1230" width="190" height="48" fill="#111111"/>
  <text x="108" y="1266" fill="#FFE14A" font-size="26" font-family="'Bungee', 'Noto Sans SC', sans-serif">STEP 02</text>
  <text x="124" y="1338" fill="#111111" font-size="34" font-weight="700" font-family="'Noto Sans SC', sans-serif">假装对面坐着一个外行，</text>
  <text x="124" y="1392" fill="#6E6A63" font-size="30" font-family="'Noto Sans SC', sans-serif">不用术语，把它从头讲一遍。</text>
  <text x="124" y="1446" fill="#6E6A63" font-size="30" font-family="'Noto Sans SC', sans-serif">讲不下去的那一句，</text>
  <text x="124" y="1492" fill="#6E6A63" font-size="30" font-family="'Noto Sans SC', sans-serif">就是下一步要补的地方。</text>
