<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440">
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="#F4EEFF" opacity="0.035"/></pattern>
    <pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse"><path d="M54 0H0V54" fill="none" stroke="#4A3772" stroke-width="1"/></pattern>
    <pattern id="hatch" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="13" height="26" fill="#FF2E88"/></pattern>
    <linearGradient id="gridFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#120B1E" stop-opacity="1"/>
      <stop offset="1" stop-color="#120B1E" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-200%" width="140%" height="500%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- 背景层：画布、透视地面网格、扫描线 -->
  <rect width="1080" height="1440" fill="#120B1E"/>
  <g opacity="0.55">
    <path d="M540 1030 L-400 1440 M540 1030 L-60 1440 M540 1030 L240 1440 M540 1030 L540 1440 M540 1030 L840 1440 M540 1030 L1140 1440 M540 1030 L1480 1440" stroke="#4A3772" stroke-width="1.5"/>
    <path d="M0 1060 H1080 M0 1100 H1080 M0 1152 H1080 M0 1222 H1080 M0 1316 H1080 M0 1440 H1080" stroke="#4A3772" stroke-width="1.5"/>
  </g>
  <rect y="1030" width="1080" height="160" fill="url(#gridFade)"/>
  <rect width="1080" height="1440" fill="url(#scan)"/>

  <!-- 结构角标 -->
  <g stroke="#4A3772" stroke-width="3" fill="none">
    <path d="M40 140 V96 H84"/><path d="M1040 140 V96 H996"/>
    <path d="M40 1336 V1380 H84"/><path d="M1040 1336 V1380 H996"/>
  </g>

  <!-- kicker -->
  <rect x="88" y="138" width="18" height="18" fill="#FF2E88"/>
  <text x="120" y="156" font-family="'Noto Sans SC', sans-serif" font-weight="700" font-size="26" fill="#FF2E88">入侵警报</text>
  <text x="992" y="156" text-anchor="end" font-family="'Chakra Petch', 'Noto Sans SC', sans-serif" font-weight="700" font-size="22" fill="#B9ABDB" letter-spacing="2">ALERT // 01</text>
  <path d="M88 190 H992" stroke="#4A3772" stroke-width="2"/>
  <path d="M88 190 H360" stroke="#FF2E88" stroke-width="4"/>

  <!-- 警报条（中景） -->
  <path d="M88 236 H880 L900 256 V300 H108 L88 280 Z" fill="#FF2E88"/>
  <g transform="translate(108 250)"><path d="M0 0 H70 L50 36 H-20 Z" fill="#120B1E" opacity="0.9"/><path d="M84 0 H120 L100 36 H64 Z" fill="#120B1E" opacity="0.9"/></g>
  <text x="248" y="279" font-family="'Noto Sans SC', sans-serif" font-weight="700" font-size="26" fill="#120B1E">WARNING · 检测到异地批量登录</text>


  <!-- 中景：被切片错位的警示三角（RGB 分离只作用于图形） -->
  <defs>
    <clipPath id="bandA"><rect x="600" y="330" width="420" height="140"/></clipPath>
    <clipPath id="bandB"><rect x="600" y="470" width="420" height="34"/></clipPath>
    <clipPath id="bandC"><rect x="600" y="504" width="420" height="140"/></clipPath>
  </defs>
  <g id="tri">
    <path d="M836 352 L974 604 H698 Z" fill="#1E1433" stroke="#FF2E88" stroke-width="10" stroke-linejoin="miter"/>
    <rect x="826" y="430" width="20" height="96" fill="#F4EEFF"/>
    <rect x="826" y="546" width="20" height="22" fill="#F4EEFF"/>
  </g>
  <g clip-path="url(#bandA)"><use href="#tri" transform="translate(-9 0)" opacity="0.55" style="mix-blend-mode:screen"/></g>
  <g clip-path="url(#bandA)"><path d="M836 352 L974 604 H698 Z" fill="none" stroke="#29E6F0" stroke-width="3" transform="translate(-10 0)" opacity="0.8"/></g>
  <rect x="690" y="470" width="300" height="34" fill="#120B1E"/>
  <g clip-path="url(#bandB)" transform="translate(30 0)">
    <path d="M836 352 L974 604 H698 Z" fill="#1E1433" stroke="#FF2E88" stroke-width="10"/>
    <rect x="826" y="430" width="20" height="96" fill="#F4EEFF"/>
  </g>
  <g clip-path="url(#bandB)" transform="translate(12 0)"><path d="M836 352 L974 604 H698 Z" fill="none" stroke="#29E6F0" stroke-width="4"/></g>
  <text x="992" y="648" text-anchor="end" font-family="'Chakra Petch', 'Noto Sans SC', sans-serif" font-weight="700" font-size="20" fill="#B9ABDB" letter-spacing="2">ERR 0x401</text>

  <!-- 主焦点：封面判断 -->
  <text font-family="'Smiley Sans', 'Noto Sans SC', sans-serif" font-size="122" fill="#F4EEFF">
    <tspan x="88" y="470">你的密码</tspan>
    <tspan x="88" y="604">早就泄露了</tspan>
  </text>
  <!-- 切片故障残留：只在装饰条上，不压标题 -->
  <rect x="88" y="636" width="410" height="12" fill="#FF2E88"/>
  <rect x="514" y="636" width="96" height="12" fill="#29E6F0"/>
  <rect x="120" y="654" width="160" height="4" fill="#FF2E88" opacity="0.6"/>
  <rect x="96" y="636" width="410" height="12" fill="#FF2E88" filter="url(#glow)" opacity="0.7"/>

  <text font-family="'Noto Sans SC', sans-serif" font-size="32" fill="#B9ABDB">
    <tspan x="88" y="730">撞库攻击不需要破解你的密码，</tspan>
    <tspan x="88" y="778">只需要你在别处<tspan fill="#F4EEFF" font-weight="700">用过同一个</tspan>。</tspan>
  </text>

  <!-- 中景：登录监控终端 -->
  <path d="M88 846 H968 L992 870 V1176 H112 L88 1152 Z" fill="#1E1433" stroke="#4A3772" stroke-width="2"/>
  <path d="M88 846 H968 L992 870 V890 H88 Z" fill="#2A1C47"/>
  <rect x="112" y="860" width="14" height="14" fill="#FF2E88"/>
  <rect x="134" y="860" width="14" height="14" fill="#4A3772"/>
  <rect x="156" y="860" width="14" height="14" fill="#4A3772"/>
  <text x="192" y="876" font-family="'Chakra Petch', 'Noto Sans SC', sans-serif" font-weight="700" font-size="18" fill="#B9ABDB" letter-spacing="2">LOGIN_MONITOR.LOG</text>
  <text x="962" y="876" text-anchor="end" font-family="'Chakra Petch', 'Noto Sans SC', sans-serif" font-weight="700" font-size="18" fill="#29E6F0" letter-spacing="2">LIVE</text>

  <g font-family="'Chakra Petch', 'Noto Sans SC', sans-serif" font-weight="700" font-size="24">
    <text x="122" y="944" fill="#B9ABDB">&gt; 02:14:07</text><text x="330" y="944" fill="#F4EEFF">mail.example</text><text x="950" y="944" text-anchor="end" fill="#B9ABDB">FAIL</text>
    <text x="122" y="992" fill="#B9ABDB">&gt; 02:14:08</text><text x="330" y="992" fill="#F4EEFF">shop.example</text><text x="950" y="992" text-anchor="end" fill="#B9ABDB">FAIL</text>
    <text x="122" y="1040" fill="#B9ABDB">&gt; 02:14:09</text><text x="330" y="1040" fill="#F4EEFF">game.example</text><text x="950" y="1040" text-anchor="end" fill="#B9ABDB">FAIL</text>
  </g>
  <!-- 命中行（前景） -->
  <rect x="112" y="1068" width="856" height="80" fill="#2A1C47"/>
  <rect x="112" y="1068" width="6" height="80" fill="#FF2E88"/>
  <text x="138" y="1118" font-family="'Chakra Petch', 'Noto Sans SC', sans-serif" font-weight="700" font-size="24" fill="#FF5A4E">&gt; 02:14:10</text>
  <text x="330" y="1119" font-family="'Noto Sans SC', sans-serif" font-weight="700" font-size="28" fill="#F4EEFF">你的主账号 · 登录成功</text>
  <path d="M866 1090 H944 V1128 H876 L866 1118 Z" fill="#FF5A4E"/>
  <text x="905" y="1117" text-anchor="middle" font-family="'Chakra Petch', 'Noto Sans SC', sans-serif" font-weight="700" font-size="22" fill="#120B1E">HIT</text>

  <!-- 错位切片（终端外框的故障残影） -->
  <rect x="600" y="1188" width="392" height="6" fill="#29E6F0" opacity="0.8"/>
  <rect x="560" y="1200" width="120" height="6" fill="#FF2E88" opacity="0.8"/>
  <text x="88" y="1240" font-family="'Chakra Petch', 'Noto Sans SC', sans-serif" font-weight="700" font-size="20" fill="#4A3772" letter-spacing="3">SIG 0x3F · TRACE 4/4</text>
</svg>
