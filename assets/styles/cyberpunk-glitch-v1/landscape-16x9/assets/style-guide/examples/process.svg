  <rect x="1440" y="672" width="320" height="5" fill="#FF2E88" opacity="0.8"/>
  <rect x="1390" y="684" width="90" height="5" fill="#29E6F0" opacity="0.8"/>

  <!-- 结论（前景）：酸黄切角条，指向第 3 步 -->
  <rect x="1196" y="336" width="40" height="28" fill="#120B1E"/>
  <path d="M1200 334 L1232 366 M1232 334 L1200 366" stroke="#FF5A4E" stroke-width="5"/>
  <path d="M920 786 H1163 V668" fill="none" stroke="#4A3772" stroke-width="2" stroke-dasharray="6 5"/>
  <path d="M1153 680 L1163 666 L1173 680" fill="none" stroke="#4A3772" stroke-width="2"/>
  <path d="M160 736 H900 L920 756 V836 H180 L160 816 Z" fill="#D4FF3A"/>
  <rect x="180" y="756" width="64" height="60" fill="url(#hatchY)"/>
  <text x="272" y="798" font-family="'Noto Sans SC', sans-serif" font-weight="700" font-size="32" fill="#120B1E">切断第 3 步：打开两步验证</text>
  <text x="1760" y="760" text-anchor="end" font-family="'Chakra Petch', 'Noto Sans SC', sans-serif" font-weight="700" font-size="20" fill="#4A3772" letter-spacing="3">PATCH · STEP 03 BLOCKED</text>
</svg>
