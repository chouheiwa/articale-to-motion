  <path d="M200 350 H1418" stroke="#29E6F0" stroke-width="4"/>
  <path d="M1418 350 H1720" stroke="#FF2E88" stroke-width="4" stroke-dasharray="10 8"/>
  <g font-family="'Chakra Petch', 'Noto Sans SC', sans-serif" font-weight="700" font-size="18" fill="#4A3772" letter-spacing="2">
    <text x="236" y="332">T+0</text><text x="642" y="332">T+3D</text><text x="1048" y="332">T+7D</text><text x="1454" y="332">T+7D 02:14</text>
  </g>

