  <path d="M1418 338 L1430 350 L1418 362 L1406 350 Z" fill="#FF2E88"/>
  <path d="M200 372 V400 M606 372 V400 M1012 372 V400 M1418 376 V400" stroke="#4A3772" stroke-width="2"/>

  <!-- 步骤卡 -->
  <g font-family="'Noto Sans SC', sans-serif">
    <path d="M160 400 H518 L542 424 V660 H160 Z" fill="#1E1433" stroke="#4A3772" stroke-width="2"/>
    <text x="188" y="452" font-family="'Chakra Petch', 'Noto Sans SC', sans-serif" font-weight="700" font-size="24" fill="#29E6F0">01</text>
    <text x="188" y="504" font-weight="700" font-size="32" fill="#F4EEFF">旧网站数据库泄露</text>
    <text x="188" y="552" font-size="24" fill="#B9ABDB">弱加密的账号和密码</text>
    <text x="188" y="588" font-size="24" fill="#B9ABDB">整批流出</text>
    <text x="514" y="636" text-anchor="end" font-family="'Chakra Petch', 'Noto Sans SC', sans-serif" font-weight="700" font-size="20" fill="#29E6F0" letter-spacing="2">[ LEAKED ]</text>

    <path d="M566 400 H924 L948 424 V660 H566 Z" fill="#1E1433" stroke="#4A3772" stroke-width="2"/>
    <text x="594" y="452" font-family="'Chakra Petch', 'Noto Sans SC', sans-serif" font-weight="700" font-size="24" fill="#29E6F0">02</text>
    <text x="594" y="504" font-weight="700" font-size="32" fill="#F4EEFF">组合被整理成字典</text>
    <text x="594" y="552" font-size="24" fill="#B9ABDB">上亿条「邮箱 + 密码」</text>
    <text x="594" y="588" font-size="24" fill="#B9ABDB">在地下流通</text>
    <text x="920" y="636" text-anchor="end" font-family="'Chakra Petch', 'Noto Sans SC', sans-serif" font-weight="700" font-size="20" fill="#29E6F0" letter-spacing="2">[ DUMPED ]</text>

    <path d="M972 400 H1330 L1354 424 V660 H972 Z" fill="#1E1433" stroke="#4A3772" stroke-width="2"/>
    <text x="1000" y="452" font-family="'Chakra Petch', 'Noto Sans SC', sans-serif" font-weight="700" font-size="24" fill="#29E6F0">03</text>
    <text x="1000" y="504" font-weight="700" font-size="32" fill="#F4EEFF">脚本批量尝试登录</text>
    <text x="1000" y="552" font-size="24" fill="#B9ABDB">每秒上千次，</text>
    <text x="1000" y="588" font-size="24" fill="#B9ABDB">不停换地址躲限流</text>
    <text x="1326" y="636" text-anchor="end" font-family="'Chakra Petch', 'Noto Sans SC', sans-serif" font-weight="700" font-size="20" fill="#29E6F0" letter-spacing="2">[ REPLAYED ]</text>

    <!-- 04：当前焦点，切片错位残影 -->
    <rect x="1394" y="416" width="366" height="8" fill="#29E6F0" opacity="0.7"/>
    <path d="M1378 400 H1736 L1760 424 V660 H1378 Z" fill="#2A1C47" stroke="#FF2E88" stroke-width="3"/>
    <rect x="1378" y="400" width="8" height="260" fill="#FF2E88"/>
    <text x="1406" y="452" font-family="'Chakra Petch', 'Noto Sans SC', sans-serif" font-weight="700" font-size="24" fill="#FF5A4E">04</text>
    <text x="1406" y="504" font-weight="700" font-size="32" fill="#F4EEFF">命中你的主账号</text>
    <text x="1406" y="552" font-size="24" fill="#B9ABDB">邮箱、支付、社交账号</text>
    <text x="1406" y="588" font-size="24" fill="#B9ABDB">接连失守</text>
    <path d="M1614 610 H1732 V648 H1624 L1614 638 Z" fill="#FF5A4E"/>
    <text x="1673" y="637" text-anchor="middle" font-family="'Chakra Petch', 'Noto Sans SC', sans-serif" font-weight="700" font-size="20" fill="#120B1E" letter-spacing="1">BREACH</text>
