  <g fill="#29E6F0">
    <path d="M200 328 L222 350 L200 372 L178 350 Z"/>
    <path d="M606 328 L628 350 L606 372 L584 350 Z"/>
    <path d="M1012 328 L1034 350 L1012 372 L990 350 Z"/>
