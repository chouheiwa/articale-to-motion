  <text x="1760" y="130" text-anchor="end" font-family="'Chakra Petch', 'Noto Sans SC', sans-serif" font-weight="700" font-size="22" fill="#B9ABDB" letter-spacing="2">KILL CHAIN // 03</text>
  <path d="M160 162 H1760" stroke="#4A3772" stroke-width="2"/>
  <path d="M160 162 H460" stroke="#29E6F0" stroke-width="4"/>
