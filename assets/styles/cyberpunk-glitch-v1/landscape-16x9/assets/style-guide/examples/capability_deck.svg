<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="#F4EEFF" opacity="0.035"/></pattern>
    <pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse"><path d="M54 0H0V54" fill="none" stroke="#4A3772" stroke-width="1"/></pattern>
    <pattern id="hatch" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="11" height="22" fill="#FF2E88"/></pattern>
    <clipPath id="tear"><rect x="0" y="596" width="1920" height="14"/></clipPath>
  </defs>

  <!-- 背景层 -->
  <rect width="1920" height="1080" fill="#120B1E"/>
  <rect width="1920" height="1080" fill="url(#grid)" opacity="0.22"/>
  <rect width="1920" height="1080" fill="url(#scan)"/>
  <g stroke="#4A3772" stroke-width="3" fill="none">
    <path d="M48 88 V44 H92"/><path d="M1872 88 V44 H1828"/>
    <path d="M48 992 V1036 H92"/><path d="M1872 992 V1036 H1828"/>
  </g>
  <rect x="48" y="960" width="300" height="22" fill="url(#hatch)" opacity="0.5"/>

  <!-- kicker + 标题 -->
  <rect x="160" y="112" width="18" height="18" fill="#FF2E88"/>
  <text x="192" y="130" font-family="'Noto Sans SC', sans-serif" font-weight="700" font-size="26" fill="#FF2E88">义体配置</text>
  <text x="1760" y="130" text-anchor="end" font-family="'Chakra Petch', 'Noto Sans SC', sans-serif" font-weight="700" font-size="22" fill="#B9ABDB" letter-spacing="2">LOADOUT // 04</text>
  <path d="M160 162 H1760" stroke="#4A3772" stroke-width="2"/>
  <path d="M160 162 H460" stroke="#FF2E88" stroke-width="4"/>
  <text x="160" y="262" font-family="'Smiley Sans', 'Noto Sans SC', sans-serif" font-size="68" fill="#F4EEFF">给账号装上五件防具</text>
  <text x="1760" y="262" text-anchor="end" font-family="'Chakra Petch', 'Noto Sans SC', sans-serif" font-weight="700" font-size="52" fill="#29E6F0">4<tspan fill="#B9ABDB">/5</tspan></text>

  <!-- 总线：核心 ↔ 槽位 -->
  <g stroke="#29E6F0" stroke-width="3" fill="none">
    <path d="M594 384 H690"/><path d="M594 552 H690"/>
    <path d="M1230 384 H1326"/>
  </g>
  <path d="M1230 552 H1326" stroke="#4A3772" stroke-width="3" stroke-dasharray="8 6"/>
  <g fill="#29E6F0">
    <rect x="636" y="378" width="12" height="12"/><rect x="636" y="546" width="12" height="12"/><rect x="1272" y="378" width="12" height="12"/>
  </g>

  <!-- 核心模块（主焦点，居中） -->
  <g id="core">
    <path d="M690 310 H1190 L1230 350 V626 H730 L690 586 Z" fill="#2A1C47" stroke="#FF2E88" stroke-width="3"/>
    <path d="M690 310 H816 L798 342 H690 Z" fill="#FF2E88"/>
    <text x="710" y="334" font-family="'Chakra Petch', 'Noto Sans SC', sans-serif" font-weight="700" font-size="20" fill="#120B1E" letter-spacing="2">CORE</text>
    <!-- 芯片图形 -->
    <g transform="translate(960 410)" fill="none" stroke="#FF2E88" stroke-width="4">
      <rect x="-44" y="-44" width="88" height="88"/>
      <rect x="-22" y="-22" width="44" height="44" fill="#FF2E88"/>
      <path d="M-26 -44 V-60 M0 -44 V-60 M26 -44 V-60 M-26 44 V60 M0 44 V60 M26 44 V60 M-44 -26 H-60 M-44 0 H-60 M-44 26 H-60 M44 -26 H60 M44 0 H60 M44 26 H60"/>
    </g>
    <text x="960" y="540" text-anchor="middle" font-family="'Smiley Sans', 'Noto Sans SC', sans-serif" font-size="62" fill="#F4EEFF">密码管理器</text>
    <text x="960" y="588" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="26" fill="#B9ABDB">每站一条随机长密码，你只记一条</text>
  </g>
  <rect x="880" y="398" width="160" height="6" fill="#29E6F0" opacity="0.8"/>
  <!-- 切片撕裂：核心板底边一条错位带 -->
  <rect x="688" y="596" width="546" height="14" fill="#120B1E"/>
  <g clip-path="url(#tear)"><use href="#core" transform="translate(22 0)"/></g>
  <rect x="1080" y="610" width="110" height="4" fill="#29E6F0"/>

  <!-- 槽位（中景）：左右各两个 -->
  <g font-family="'Noto Sans SC', sans-serif">
    <path d="M160 310 H574 L594 330 V458 H160 Z" fill="#1E1433" stroke="#29E6F0" stroke-width="2"/>
    <text x="186" y="350" font-family="'Chakra Petch', 'Noto Sans SC', sans-serif" font-weight="700" font-size="20" fill="#29E6F0" letter-spacing="2">SLOT_A</text>
    <text x="186" y="400" font-weight="700" font-size="34" fill="#F4EEFF">两步验证</text>
    <text x="186" y="440" font-size="24" fill="#B9ABDB">密码泄露了也登不进</text>

    <path d="M160 478 H574 L594 498 V626 H160 Z" fill="#1E1433" stroke="#29E6F0" stroke-width="2"/>
    <text x="186" y="518" font-family="'Chakra Petch', 'Noto Sans SC', sans-serif" font-weight="700" font-size="20" fill="#29E6F0" letter-spacing="2">SLOT_B</text>
    <text x="186" y="568" font-weight="700" font-size="34" fill="#F4EEFF">泄露监测</text>
    <text x="186" y="608" font-size="24" fill="#B9ABDB">库被拖时第一时间提醒</text>

    <path d="M1326 310 H1740 L1760 330 V458 H1326 Z" fill="#1E1433" stroke="#29E6F0" stroke-width="2"/>
    <text x="1352" y="350" font-family="'Chakra Petch', 'Noto Sans SC', sans-serif" font-weight="700" font-size="20" fill="#29E6F0" letter-spacing="2">SLOT_C</text>
    <text x="1352" y="400" font-weight="700" font-size="34" fill="#F4EEFF">独立找回邮箱</text>
    <text x="1352" y="440" font-size="24" fill="#B9ABDB">不在任何网站公开使用</text>

    <path d="M1326 478 H1740 L1760 498 V626 H1326 Z" fill="#1E1433" stroke="#4A3772" stroke-width="2" stroke-dasharray="10 6"/>
    <text x="1352" y="518" font-family="'Chakra Petch', 'Noto Sans SC', sans-serif" font-weight="700" font-size="20" fill="#B9ABDB" letter-spacing="2">SLOT_D // EMPTY</text>
    <text x="1352" y="568" font-weight="700" font-size="34" fill="#B9ABDB">异地登录提醒</text>
    <text x="1352" y="608" font-size="24" fill="#B9ABDB">陌生设备登录立即推送</text>
  </g>
  <!-- 装配进度块 -->
  <g fill="#29E6F0">
    <rect x="516" y="340" width="12" height="12"/><rect x="534" y="340" width="12" height="12"/><rect x="552" y="340" width="12" height="12"/>
    <rect x="516" y="508" width="12" height="12"/><rect x="534" y="508" width="12" height="12"/><rect x="552" y="508" width="12" height="12"/>
    <rect x="1682" y="340" width="12" height="12"/><rect x="1700" y="340" width="12" height="12"/><rect x="1718" y="340" width="12" height="12"/>
  </g>
  <g fill="none" stroke="#4A3772" stroke-width="2">
    <rect x="1683" y="509" width="10" height="10"/><rect x="1701" y="509" width="10" height="10"/><rect x="1719" y="509" width="10" height="10"/>
  </g>

  <!-- 完整度条 -->
  <text x="160" y="690" font-family="'Chakra Petch', 'Noto Sans SC', sans-serif" font-weight="700" font-size="20" fill="#B9ABDB" letter-spacing="3">INTEGRITY 75%</text>
  <rect x="380" y="676" width="1380" height="12" fill="#1E1433"/>
  <rect x="380" y="676" width="1035" height="12" fill="#29E6F0"/>
  <path d="M1415 670 V694" stroke="#F4EEFF" stroke-width="3"/>

  <!-- 结论（前景）：酸黄锁定 -->
  <g stroke="#D4FF3A" stroke-width="5" fill="none">
    <path d="M540 766 V738 H568"/><path d="M1380 766 V738 H1352"/>
    <path d="M540 818 V846 H568"/><path d="M1380 818 V846 H1352"/>
  </g>
  <text x="600" y="804" font-family="'Chakra Petch', 'Noto Sans SC', sans-serif" font-weight="700" font-size="24" fill="#D4FF3A" letter-spacing="2">LOCK_ON</text>
  <text x="740" y="804" font-family="'Noto Sans SC', sans-serif" font-weight="700" font-size="32" fill="#F4EEFF">先装核心，再补齐四个槽位</text>
  <g font-family="'Chakra Petch', 'Noto Sans SC', sans-serif" font-weight="700" font-size="20" fill="#4A3772" letter-spacing="3">
    <text x="160" y="800">3/4 SLOTS ONLINE</text>
    <text x="1760" y="800" text-anchor="end">NEXT · SLOT_D</text>
  </g>
  <path d="M160 818 H500 M1420 818 H1760" stroke="#4A3772" stroke-width="2"/>
</svg>
