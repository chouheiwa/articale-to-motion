<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="#F4EEFF" opacity="0.035"/></pattern>
    <pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse"><path d="M54 0H0V54" fill="none" stroke="#4A3772" stroke-width="1"/></pattern>
  </defs>

  <!-- 背景层 -->
  <rect width="1920" height="1080" fill="#120B1E"/>
  <rect width="1920" height="1080" fill="url(#grid)" opacity="0.28"/>
  <rect width="1920" height="1080" fill="url(#scan)"/>
  <g stroke="#4A3772" stroke-width="3" fill="none">
    <path d="M48 88 V44 H92"/><path d="M1872 88 V44 H1828"/>
    <path d="M48 992 V1036 H92"/><path d="M1872 992 V1036 H1828"/>
  </g>

  <!-- kicker + 标题 -->
  <rect x="160" y="112" width="18" height="18" fill="#29E6F0"/>
  <text x="192" y="130" font-family="'Noto Sans SC', sans-serif" font-weight="700" font-size="26" fill="#29E6F0">信号对撞</text>
  <text x="1760" y="130" text-anchor="end" font-family="'Chakra Petch', 'Noto Sans SC', sans-serif" font-weight="700" font-size="22" fill="#B9ABDB" letter-spacing="2">SIGNAL // 02</text>
  <path d="M160 162 H1760" stroke="#4A3772" stroke-width="2"/>
  <path d="M160 162 H460" stroke="#29E6F0" stroke-width="4"/>
  <text x="160" y="262" font-family="'Smiley Sans', 'Noto Sans SC', sans-serif" font-size="68" fill="#F4EEFF">复杂密码，救不了复用</text>
  <text x="1760" y="258" text-anchor="end" font-family="'Chakra Petch', 'Noto Sans SC', sans-serif" font-weight="700" font-size="22" fill="#4A3772" letter-spacing="3">SURFACE ≠ ROOT CAUSE</text>

  <!-- 面板 A：表象（品红，左） -->
  <path d="M160 314 H922 L884 700 H160 Z" fill="#1E1433" stroke="#FF2E88" stroke-width="2.5"/>
  <path d="M160 314 H312 L292 354 H160 Z" fill="#FF2E88"/>
  <text x="184" y="344" font-family="'Noto Sans SC', sans-serif" font-weight="700" font-size="24" fill="#120B1E">你以为</text>
  <text x="880" y="346" text-anchor="end" font-family="'Chakra Petch', 'Noto Sans SC', sans-serif" font-weight="700" font-size="20" fill="#B9ABDB" letter-spacing="2">SURFACE</text>
  <text x="200" y="438" font-family="'Smiley Sans', 'Noto Sans SC', sans-serif" font-size="56" fill="#F4EEFF">密码够复杂就安全</text>
  <text x="200" y="490" font-family="'Noto Sans SC', sans-serif" font-size="28" fill="#B9ABDB">大小写 + 数字 + 符号，足足 16 位</text>
  <!-- 密码输入框 -->
  <path d="M200 522 H820 L808 586 H200 Z" fill="#120B1E" stroke="#4A3772" stroke-width="2"/>
  <g fill="#F4EEFF">
    <circle cx="232" cy="554" r="8"/><circle cx="260" cy="554" r="8"/><circle cx="288" cy="554" r="8"/><circle cx="316" cy="554" r="8"/><circle cx="344" cy="554" r="8"/><circle cx="372" cy="554" r="8"/><circle cx="400" cy="554" r="8"/><circle cx="428" cy="554" r="8"/>
    <circle cx="456" cy="554" r="8"/><circle cx="484" cy="554" r="8"/><circle cx="512" cy="554" r="8"/><circle cx="540" cy="554" r="8"/><circle cx="568" cy="554" r="8"/><circle cx="596" cy="554" r="8"/><circle cx="624" cy="554" r="8"/><circle cx="652" cy="554" r="8"/>
  </g>
  <rect x="676" y="538" width="4" height="32" fill="#FF2E88"/>
  <!-- 强度条 -->
  <text x="200" y="648" font-family="'Chakra Petch', 'Noto Sans SC', sans-serif" font-weight="700" font-size="20" fill="#B9ABDB" letter-spacing="2">STRENGTH</text>
  <g fill="#FF2E88">
    <path d="M330 630 H410 L402 652 H322 Z"/><path d="M420 630 H500 L492 652 H412 Z"/><path d="M510 630 H590 L582 652 H502 Z"/><path d="M600 630 H680 L672 652 H592 Z"/><path d="M690 630 H770 L762 652 H682 Z"/>
  </g>

  <!-- 中缝：斜向撕裂线 + VS -->
  <path d="M946 300 L928 470 L948 480 L916 716" stroke="#4A3772" stroke-width="2" fill="none"/>
  <rect x="900" y="300" width="5" height="120" fill="#FF2E88" opacity="0.8"/>
  <rect x="1012" y="600" width="5" height="116" fill="#29E6F0" opacity="0.8"/>
  <path d="M902 478 H1018 L996 540 H880 Z" fill="#120B1E" stroke="#F4EEFF" stroke-width="2.5"/>
  <text x="949" y="522" text-anchor="middle" font-family="'Chakra Petch', 'Noto Sans SC', sans-serif" font-weight="700" font-size="30" fill="#F4EEFF">VS</text>

  <!-- 面板 B：真相（青，右） -->
  <path d="M998 314 H1760 V700 H960 Z" fill="#2A1C47" stroke="#29E6F0" stroke-width="2.5"/>
  <path d="M1760 314 H1628 L1648 354 H1760 Z" fill="#29E6F0"/>
  <text x="1736" y="344" text-anchor="end" font-family="'Noto Sans SC', sans-serif" font-weight="700" font-size="24" fill="#120B1E">真相</text>
  <text x="1040" y="346" font-family="'Chakra Petch', 'Noto Sans SC', sans-serif" font-weight="700" font-size="20" fill="#B9ABDB" letter-spacing="2">ROOT CAUSE</text>
  <text x="1040" y="438" font-family="'Smiley Sans', 'Noto Sans SC', sans-serif" font-size="56" fill="#F4EEFF">同一密码用在 <tspan fill="#29E6F0">12</tspan> 个网站</text>
  <text x="1040" y="490" font-family="'Noto Sans SC', sans-serif" font-size="28" fill="#B9ABDB">任何一站泄露，12 个账号一起失守</text>
  <!-- 12 个账号格 -->
  <g>
    <rect x="1040" y="530" width="46" height="46" fill="#FF5A4E"/>
    <g fill="none" stroke="#FF2E88" stroke-width="2.5">
      <rect x="1098" y="530" width="46" height="46"/><rect x="1156" y="530" width="46" height="46"/><rect x="1214" y="530" width="46" height="46"/><rect x="1272" y="530" width="46" height="46"/><rect x="1330" y="530" width="46" height="46"/><rect x="1388" y="530" width="46" height="46"/><rect x="1446" y="530" width="46" height="46"/><rect x="1504" y="530" width="46" height="46"/><rect x="1562" y="530" width="46" height="46"/><rect x="1620" y="530" width="46" height="46"/><rect x="1678" y="530" width="46" height="46"/>
    </g>
    <path d="M1054 544 L1072 562 M1072 544 L1054 562" stroke="#120B1E" stroke-width="4"/>
    <path d="M1063 576 V604 H1701 V576" fill="none" stroke="#FF2E88" stroke-width="2" stroke-dasharray="8 6"/>
  </g>
  <text x="1040" y="648" font-family="'Chakra Petch', 'Noto Sans SC', sans-serif" font-weight="700" font-size="20" fill="#29E6F0" letter-spacing="2">1 LEAK → 12 BREACH</text>

  <!-- 结论层：酸黄锁定框 -->
  <g stroke="#D4FF3A" stroke-width="5" fill="none">
    <path d="M500 770 V742 H528"/><path d="M1420 770 V742 H1392"/>
    <path d="M500 826 V854 H528"/><path d="M1420 826 V854 H1392"/>
  </g>
  <text x="960" y="810" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-weight="700" font-size="34" fill="#F4EEFF">强度决定难不难破，<tspan fill="#D4FF3A">唯一性决定会不会连坐</tspan></text>
  <text x="160" y="810" font-family="'Chakra Petch', 'Noto Sans SC', sans-serif" font-weight="700" font-size="20" fill="#4A3772" letter-spacing="3">LOCK_ON</text>
  <text x="1760" y="810" text-anchor="end" font-family="'Chakra Petch', 'Noto Sans SC', sans-serif" font-weight="700" font-size="20" fill="#4A3772" letter-spacing="3">CONCLUSION</text>
  <path d="M160 826 H440 M1480 826 H1760" stroke="#4A3772" stroke-width="2"/>
</svg>
