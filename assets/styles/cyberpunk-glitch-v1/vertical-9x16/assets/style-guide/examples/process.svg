<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="#F4EEFF" opacity="0.035"/></pattern>
    <pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse"><path d="M54 0H0V54" fill="none" stroke="#4A3772" stroke-width="1"/></pattern>
    <pattern id="hatchY" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="24" fill="#120B1E"/></pattern>
  </defs>

  <!-- 背景层 -->
  <rect width="1080" height="1920" fill="#120B1E"/>
  <rect width="1080" height="1920" fill="url(#grid)" opacity="0.22"/>
  <text x="1036" y="1800" text-anchor="end" font-family="'Chakra Petch', 'Noto Sans SC', sans-serif" font-weight="700" font-size="170" fill="#1E1433">4/4</text>
  <rect width="1080" height="1920" fill="url(#scan)"/>
  <g stroke="#4A3772" stroke-width="3" fill="none">
    <path d="M40 140 V96 H84"/><path d="M1040 140 V96 H996"/>
    <path d="M40 1816 V1860 H84"/><path d="M1040 1816 V1860 H996"/>
  </g>

  <!-- kicker + 标题 -->
  <rect x="88" y="138" width="18" height="18" fill="#29E6F0"/>
  <text x="120" y="156" font-family="'Noto Sans SC', sans-serif" font-weight="700" font-size="26" fill="#29E6F0">破解链路</text>
  <text x="992" y="156" text-anchor="end" font-family="'Chakra Petch', 'Noto Sans SC', sans-serif" font-weight="700" font-size="22" fill="#B9ABDB" letter-spacing="2">KILL CHAIN // 03</text>
  <path d="M88 190 H992" stroke="#4A3772" stroke-width="2"/>
  <path d="M88 190 H360" stroke="#29E6F0" stroke-width="4"/>
  <text x="88" y="306" font-family="'Smiley Sans', 'Noto Sans SC', sans-serif" font-size="76" fill="#F4EEFF">一次撞库，要走四步</text>

  <!-- 链路轨道 -->
  <path d="M130 464 V876" stroke="#29E6F0" stroke-width="4"/>
  <path d="M130 876 V1082" stroke="#FF2E88" stroke-width="4" stroke-dasharray="10 8"/>
  <g fill="#29E6F0">
    <path d="M130 440 L154 464 L130 488 L106 464 Z"/>
    <path d="M130 646 L154 670 L130 694 L106 670 Z"/>
    <path d="M130 852 L154 876 L130 900 L106 876 Z"/>
  </g>
  <path d="M130 1054 L158 1082 L130 1110 L102 1082 Z" fill="#120B1E" stroke="#FF2E88" stroke-width="4"/>
  <path d="M130 1068 L144 1082 L130 1096 L116 1082 Z" fill="#FF2E88"/>

  <g font-family="'Noto Sans SC', sans-serif">
    <path d="M184 390 H964 L992 418 V538 H184 Z" fill="#1E1433" stroke="#4A3772" stroke-width="2"/>
    <text x="212" y="450" font-family="'Chakra Petch', 'Noto Sans SC', sans-serif" font-weight="700" font-size="26" fill="#29E6F0">01</text>
    <text x="266" y="452" font-weight="700" font-size="34" fill="#F4EEFF">旧网站数据库泄露</text>
    <text x="266" y="504" font-size="26" fill="#B9ABDB">弱加密的账号和密码整批流出</text>
    <text x="964" y="452" text-anchor="end" font-family="'Chakra Petch', 'Noto Sans SC', sans-serif" font-weight="700" font-size="20" fill="#29E6F0" letter-spacing="2">[ LEAKED ]</text>

    <path d="M184 596 H964 L992 624 V744 H184 Z" fill="#1E1433" stroke="#4A3772" stroke-width="2"/>
    <text x="212" y="656" font-family="'Chakra Petch', 'Noto Sans SC', sans-serif" font-weight="700" font-size="26" fill="#29E6F0">02</text>
    <text x="266" y="658" font-weight="700" font-size="34" fill="#F4EEFF">组合被整理成字典</text>
    <text x="266" y="710" font-size="26" fill="#B9ABDB">上亿条「邮箱 + 密码」在地下流通</text>
    <text x="964" y="658" text-anchor="end" font-family="'Chakra Petch', 'Noto Sans SC', sans-serif" font-weight="700" font-size="20" fill="#29E6F0" letter-spacing="2">[ DUMPED ]</text>

    <path d="M184 802 H964 L992 830 V950 H184 Z" fill="#1E1433" stroke="#4A3772" stroke-width="2"/>
    <text x="212" y="862" font-family="'Chakra Petch', 'Noto Sans SC', sans-serif" font-weight="700" font-size="26" fill="#29E6F0">03</text>
    <text x="266" y="864" font-weight="700" font-size="34" fill="#F4EEFF">脚本批量尝试登录</text>
    <text x="266" y="916" font-size="26" fill="#B9ABDB">每秒上千次，不停换地址躲限流</text>
    <text x="964" y="864" text-anchor="end" font-family="'Chakra Petch', 'Noto Sans SC', sans-serif" font-weight="700" font-size="20" fill="#29E6F0" letter-spacing="2">[ REPLAYED ]</text>

    <rect x="200" y="1024" width="792" height="8" fill="#29E6F0" opacity="0.7"/>
    <path d="M184 1008 H964 L992 1036 V1156 H184 Z" fill="#2A1C47" stroke="#FF2E88" stroke-width="3"/>
    <rect x="184" y="1008" width="8" height="148" fill="#FF2E88"/>
    <text x="212" y="1068" font-family="'Chakra Petch', 'Noto Sans SC', sans-serif" font-weight="700" font-size="26" fill="#FF5A4E">04</text>
    <text x="266" y="1070" font-weight="700" font-size="34" fill="#F4EEFF">命中你的主账号</text>
    <text x="266" y="1122" font-size="26" fill="#B9ABDB">邮箱、支付、社交账号接连失守</text>
    <path d="M840 1044 H964 V1084 H850 L840 1074 Z" fill="#FF5A4E"/>
    <text x="902" y="1072" text-anchor="middle" font-family="'Chakra Petch', 'Noto Sans SC', sans-serif" font-weight="700" font-size="20" fill="#120B1E" letter-spacing="1">BREACH</text>
  </g>
  <rect x="640" y="1170" width="352" height="5" fill="#FF2E88" opacity="0.8"/>
  <rect x="588" y="1184" width="90" height="5" fill="#29E6F0" opacity="0.8"/>

  <!-- 结论：酸黄切角条 -->
  <path d="M88 1256 H880 L900 1276 V1362 H108 L88 1342 Z" fill="#D4FF3A"/>
  <rect x="108" y="1278" width="64" height="62" fill="url(#hatchY)"/>
  <text x="196" y="1322" font-family="'Noto Sans SC', sans-serif" font-weight="700" font-size="34" fill="#120B1E">切断第 3 步：打开两步验证</text>

  <!-- 补丁终端（前景说明） -->
  <path d="M88 1414 H876 L900 1438 V1620 H88 Z" fill="#1E1433" stroke="#4A3772" stroke-width="2"/>
  <text x="116" y="1464" font-family="'Chakra Petch', 'Noto Sans SC', sans-serif" font-weight="700" font-size="20" fill="#B9ABDB" letter-spacing="2">PATCH_NOTE.TXT</text>
  <text x="116" y="1526" font-family="'Chakra Petch', 'Noto Sans SC', sans-serif" font-weight="700" font-size="28" fill="#29E6F0">&gt;</text>
  <text x="206" y="1526" font-family="'Noto Sans SC', sans-serif" font-size="28" fill="#F4EEFF">字典里的密码再对，也缺一道验证码</text>
  <text x="116" y="1580" font-family="'Chakra Petch', 'Noto Sans SC', sans-serif" font-weight="700" font-size="24" fill="#29E6F0">[ OK ]</text>
  <text x="206" y="1580" font-family="'Noto Sans SC', sans-serif" font-size="28" fill="#B9ABDB">脚本停在第 3 步，账号保住</text>
</svg>
