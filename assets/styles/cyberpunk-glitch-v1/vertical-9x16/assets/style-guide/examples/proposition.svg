<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="#F4EEFF" opacity="0.035"/></pattern>
    <linearGradient id="gridFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#120B1E" stop-opacity="1"/>
      <stop offset="1" stop-color="#120B1E" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-200%" width="140%" height="500%"><feGaussianBlur stdDeviation="6"/></filter>
    <clipPath id="bandA"><rect x="700" y="330" width="360" height="130"/></clipPath>
    <clipPath id="bandB"><rect x="700" y="460" width="360" height="34"/></clipPath>
  </defs>

  <!-- 背景层：画布、透视地面网格、扫描线 -->
  <rect width="1080" height="1920" fill="#120B1E"/>
  <g opacity="0.55" stroke="#4A3772" stroke-width="1.5">
    <path d="M540 1520 L-400 1920 M540 1520 L-60 1920 M540 1520 L240 1920 M540 1520 L540 1920 M540 1520 L840 1920 M540 1520 L1140 1920 M540 1520 L1480 1920"/>
    <path d="M0 1550 H1080 M0 1590 H1080 M0 1642 H1080 M0 1712 H1080 M0 1806 H1080"/>
  </g>
  <rect y="1520" width="1080" height="160" fill="url(#gridFade)"/>
  <rect width="1080" height="1920" fill="url(#scan)"/>
  <g stroke="#4A3772" stroke-width="3" fill="none">
    <path d="M40 140 V96 H84"/><path d="M1040 140 V96 H996"/>
    <path d="M40 1816 V1860 H84"/><path d="M1040 1816 V1860 H996"/>
  </g>

  <!-- kicker -->
  <rect x="88" y="138" width="18" height="18" fill="#FF2E88"/>
  <text x="120" y="156" font-family="'Noto Sans SC', sans-serif" font-weight="700" font-size="26" fill="#FF2E88">入侵警报</text>
  <text x="992" y="156" text-anchor="end" font-family="'Chakra Petch', 'Noto Sans SC', sans-serif" font-weight="700" font-size="22" fill="#B9ABDB" letter-spacing="2">ALERT // 01</text>
  <path d="M88 190 H992" stroke="#4A3772" stroke-width="2"/>
  <path d="M88 190 H360" stroke="#FF2E88" stroke-width="4"/>

  <!-- 警报条 -->
  <path d="M88 236 H880 L900 256 V300 H108 L88 280 Z" fill="#FF2E88"/>
  <g transform="translate(108 250)"><path d="M0 0 H70 L50 36 H-20 Z" fill="#120B1E" opacity="0.9"/><path d="M84 0 H120 L100 36 H64 Z" fill="#120B1E" opacity="0.9"/></g>
  <text x="248" y="279" font-family="'Noto Sans SC', sans-serif" font-weight="700" font-size="26" fill="#120B1E">WARNING · 检测到异地批量登录</text>

  <!-- 切片错位的警示三角 -->
  <g id="tri">
    <path d="M880 350 L990 552 H770 Z" fill="#1E1433" stroke="#FF2E88" stroke-width="9"/>
    <rect x="872" y="414" width="16" height="78" fill="#F4EEFF"/>
    <rect x="872" y="508" width="16" height="18" fill="#F4EEFF"/>
  </g>
  <g clip-path="url(#bandA)"><path d="M880 350 L990 552 H770 Z" fill="none" stroke="#29E6F0" stroke-width="3" transform="translate(-9 0)" opacity="0.85"/></g>
  <rect x="764" y="460" width="232" height="34" fill="#120B1E"/>
  <g clip-path="url(#bandB)" transform="translate(24 0)">
    <path d="M880 350 L990 552 H770 Z" fill="#1E1433" stroke="#FF2E88" stroke-width="9"/>
    <rect x="872" y="414" width="16" height="78" fill="#F4EEFF"/>
  </g>
  <g clip-path="url(#bandB)" transform="translate(8 0)"><path d="M880 350 L990 552 H770 Z" fill="none" stroke="#29E6F0" stroke-width="4"/></g>
  <text x="992" y="592" text-anchor="end" font-family="'Chakra Petch', 'Noto Sans SC', sans-serif" font-weight="700" font-size="20" fill="#B9ABDB" letter-spacing="2">ERR 0x401</text>

  <!-- 主焦点：封面判断（cover_title 区） -->
  <text font-family="'Smiley Sans', 'Noto Sans SC', sans-serif" font-size="128" fill="#F4EEFF">
    <tspan x="88" y="500">你的密码</tspan>
    <tspan x="88" y="648">早就泄露了</tspan>
  </text>
  <rect x="96" y="684" width="430" height="12" fill="#FF2E88" filter="url(#glow)" opacity="0.7"/>
  <rect x="88" y="684" width="430" height="12" fill="#FF2E88"/>
  <rect x="534" y="684" width="100" height="12" fill="#29E6F0"/>
  <rect x="120" y="702" width="170" height="4" fill="#FF2E88" opacity="0.6"/>

  <text font-family="'Noto Sans SC', sans-serif" font-size="34" fill="#B9ABDB">
    <tspan x="88" y="794">撞库攻击不需要破解你的密码，</tspan>
    <tspan x="88" y="848">只需要你在别处<tspan fill="#F4EEFF" font-weight="700">用过同一个</tspan>。</tspan>
  </text>

  <!-- 中景：登录监控终端 -->
  <path d="M88 930 H968 L992 954 V1356 H112 L88 1332 Z" fill="#1E1433" stroke="#4A3772" stroke-width="2"/>
  <path d="M88 930 H968 L992 954 V976 H88 Z" fill="#2A1C47"/>
  <rect x="112" y="945" width="14" height="14" fill="#FF2E88"/>
  <rect x="134" y="945" width="14" height="14" fill="#4A3772"/>
  <rect x="156" y="945" width="14" height="14" fill="#4A3772"/>
  <text x="192" y="961" font-family="'Chakra Petch', 'Noto Sans SC', sans-serif" font-weight="700" font-size="18" fill="#B9ABDB" letter-spacing="2">LOGIN_MONITOR.LOG</text>
  <text x="962" y="961" text-anchor="end" font-family="'Chakra Petch', 'Noto Sans SC', sans-serif" font-weight="700" font-size="18" fill="#29E6F0" letter-spacing="2">LIVE</text>
  <g font-family="'Chakra Petch', 'Noto Sans SC', sans-serif" font-weight="700" font-size="26">
    <text x="122" y="1036" fill="#B9ABDB">&gt; 02:14:06</text><text x="336" y="1036" fill="#F4EEFF">video.example</text><text x="950" y="1036" text-anchor="end" fill="#B9ABDB">FAIL</text>
    <text x="122" y="1090" fill="#B9ABDB">&gt; 02:14:07</text><text x="336" y="1090" fill="#F4EEFF">mail.example</text><text x="950" y="1090" text-anchor="end" fill="#B9ABDB">FAIL</text>
    <text x="122" y="1144" fill="#B9ABDB">&gt; 02:14:08</text><text x="336" y="1144" fill="#F4EEFF">shop.example</text><text x="950" y="1144" text-anchor="end" fill="#B9ABDB">FAIL</text>
    <text x="122" y="1198" fill="#B9ABDB">&gt; 02:14:09</text><text x="336" y="1198" fill="#F4EEFF">game.example</text><text x="950" y="1198" text-anchor="end" fill="#B9ABDB">FAIL</text>
  </g>
  <rect x="112" y="1232" width="856" height="92" fill="#2A1C47"/>
  <rect x="112" y="1232" width="6" height="92" fill="#FF2E88"/>
  <text x="138" y="1288" font-family="'Chakra Petch', 'Noto Sans SC', sans-serif" font-weight="700" font-size="26" fill="#FF5A4E">&gt; 02:14:10</text>
  <text x="336" y="1289" font-family="'Noto Sans SC', sans-serif" font-weight="700" font-size="30" fill="#F4EEFF">你的主账号 · 登录成功</text>
  <path d="M860 1258 H944 V1298 H870 L860 1288 Z" fill="#FF5A4E"/>
  <text x="902" y="1286" text-anchor="middle" font-family="'Chakra Petch', 'Noto Sans SC', sans-serif" font-weight="700" font-size="22" fill="#120B1E">HIT</text>
  <rect x="600" y="1368" width="392" height="6" fill="#29E6F0" opacity="0.8"/>
  <rect x="560" y="1380" width="120" height="6" fill="#FF2E88" opacity="0.8"/>

  <!-- 统计条 -->
  <g font-family="'Chakra Petch', 'Noto Sans SC', sans-serif" font-weight="700">
    <path d="M88 1440 H340 L360 1460 V1580 H88 Z" fill="#1E1433" stroke="#4A3772" stroke-width="2"/>
    <text x="112" y="1486" font-size="22" fill="#B9ABDB" letter-spacing="2">TRIES</text>
    <text x="112" y="1552" font-size="52" fill="#F4EEFF">3,214</text>
    <path d="M380 1440 H624 L644 1460 V1580 H380 Z" fill="#1E1433" stroke="#4A3772" stroke-width="2"/>
    <text x="404" y="1486" font-size="22" fill="#B9ABDB" letter-spacing="2">FAILED</text>
    <text x="404" y="1552" font-size="52" fill="#F4EEFF">3,213</text>
    <path d="M664 1440 H880 L900 1460 V1580 H664 Z" fill="#1E1433" stroke="#FF2E88" stroke-width="2.5"/>
    <text x="688" y="1486" font-size="22" fill="#FF2E88" letter-spacing="2">HIT</text>
    <text x="688" y="1552" font-size="52" fill="#FF2E88">1</text>
    <text x="728" y="1550" font-family="'Noto Sans SC', sans-serif" font-weight="700" font-size="26" fill="#F4EEFF">就够了</text>
  </g>
</svg>
