<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <rect width="1080" height="1920" fill="#F4EFE6"/>

  <!-- 版头 -->
  <g font-family="'Noto Sans SC', sans-serif">
    <text x="88" y="150" fill="#1A1714" font-size="24" font-weight="700" letter-spacing="4">长文 · 阅读与注意力</text>
    <text x="992" y="150" text-anchor="end" fill="#6B6155" font-size="24" font-weight="600" letter-spacing="3">第 07 期</text>
  </g>
  <rect x="88" y="172" width="904" height="4" fill="#1A1714"/>

  <!-- 标题 -->
  <text x="84" y="350" fill="#1A1714" font-family="'Noto Serif SC', serif" font-size="110" font-weight="700" letter-spacing="12">目录</text>
  <text x="900" y="346" text-anchor="end" fill="#6B6155" font-family="'Noto Serif SC', serif" font-size="30" letter-spacing="6">CONTENTS</text>
  <text x="88" y="420" fill="#4A433B" font-family="'Noto Serif SC', serif" font-size="30">一期关于注意力的长文，共六个章节。</text>
  <rect x="88" y="460" width="812" height="4" fill="#1A1714"/>

  <!-- 条目 -->
  <g font-family="'Noto Serif SC', serif">
    <text x="88" y="552" fill="#1A1714" font-size="48" font-weight="700">07</text>
    <text x="297" y="542" fill="#1A1714" font-size="36" font-weight="700">我们为何读不完一本书</text>
    <text x="297" y="588" fill="#4A433B" font-size="28">封面故事：注意力去了哪里</text>
  </g>
  <rect x="88" y="624" width="812" height="1.5" fill="#CBC1AF"/>
  <g font-family="'Noto Serif SC', serif">
    <text x="88" y="700" fill="#1A1714" font-size="48" font-weight="700">24</text>
    <text x="297" y="690" fill="#1A1714" font-size="36" font-weight="700">碎片时间是怎样被切出来的</text>
    <text x="297" y="736" fill="#4A433B" font-size="28">从通知到推送，一天被切成几百段</text>
  </g>

  <!-- 当前章节：墨色底板 -->
  <rect x="64" y="772" width="860" height="140" fill="#1A1714"/>
  <g font-family="'Noto Serif SC', serif">
    <text x="88" y="860" fill="#E0664F" font-size="48" font-weight="700">38</text>
    <text x="297" y="838" fill="#F4EFE6" font-size="36" font-weight="700">纸与屏幕，读法不同</text>
    <text x="297" y="884" fill="#EAE3D5" font-size="28">同一篇文章，两种阅读路径</text>
  </g>
  <text x="872" y="838" text-anchor="end" fill="#E0664F" font-family="'Noto Sans SC', sans-serif" font-size="24" font-weight="700" letter-spacing="3">本节</text>

  <g font-family="'Noto Serif SC', serif">
    <text x="88" y="1000" fill="#1A1714" font-size="48" font-weight="700">52</text>
    <text x="297" y="990" fill="#1A1714" font-size="36" font-weight="700">找回专注的三个练习</text>
    <text x="297" y="1036" fill="#4A433B" font-size="28">每一步只需要十分钟</text>
  </g>
  <rect x="88" y="1072" width="812" height="1.5" fill="#CBC1AF"/>
  <g font-family="'Noto Serif SC', serif">
    <text x="88" y="1148" fill="#1A1714" font-size="48" font-weight="700">66</text>
    <text x="297" y="1138" fill="#1A1714" font-size="36" font-weight="700">慢读，不是读得慢</text>
    <text x="297" y="1184" fill="#4A433B" font-size="28">一位老编辑的阅读笔记</text>
  </g>
  <rect x="88" y="1220" width="812" height="1.5" fill="#CBC1AF"/>
  <g font-family="'Noto Serif SC', serif">
    <text x="88" y="1296" fill="#1A1714" font-size="48" font-weight="700">78</text>
    <text x="297" y="1286" fill="#1A1714" font-size="36" font-weight="700">读者来信</text>
    <text x="297" y="1332" fill="#4A433B" font-size="28">你最近一次读完的书是什么</text>
  </g>
  <rect x="88" y="1370" width="812" height="1.5" fill="#1A1714"/>
  <text x="88" y="1420" fill="#6B6155" font-family="'Noto Sans SC', sans-serif" font-size="24" font-weight="600" letter-spacing="2">本期共六章 · 全文约 2.1 万字</text>

  <!-- 下期预告（非关键） -->
  <rect x="88" y="1668" width="904" height="118" fill="#EAE3D5"/>
  <text x="120" y="1716" fill="#A82E1C" font-family="'Noto Sans SC', sans-serif" font-size="24" font-weight="700" letter-spacing="4">下期预告</text>
  <text x="120" y="1760" fill="#1A1714" font-family="'Noto Serif SC', serif" font-size="28" font-weight="700">城市里，如何留出一段安静的时间</text>

  <!-- 页脚（非关键） -->
  <rect x="88" y="1818" width="904" height="1.5" fill="#1A1714"/>
  <g font-family="'Noto Sans SC', sans-serif" font-size="24" font-weight="600" fill="#6B6155">
    <text x="88" y="1852" letter-spacing="2">目录</text>
    <text x="992" y="1852" text-anchor="end" font-family="'Noto Serif SC', serif" font-weight="700" fill="#1A1714">03</text>
  </g>
</svg>
