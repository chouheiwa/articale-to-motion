<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#F4EFE6"/>

  <!-- 版头 -->
  <g font-family="'Noto Sans SC', sans-serif">
    <text x="160" y="132" fill="#1A1714" font-size="24" font-weight="700" letter-spacing="4">长文 · 阅读与注意力</text>
    <text x="1760" y="132" text-anchor="end" fill="#6B6155" font-size="24" font-weight="600" letter-spacing="3">第 07 期</text>
  </g>
  <rect x="160" y="152" width="1600" height="4" fill="#1A1714"/>

  <!-- 左：眉题与标题 -->
  <g font-family="'Noto Sans SC', sans-serif">
    <rect x="160" y="222" width="48" height="4" fill="#A82E1C"/>
    <text x="224" y="234" fill="#A82E1C" font-size="26" font-weight="700" letter-spacing="6">编号长文</text>
  </g>
  <text x="158" y="318" fill="#1A1714" font-family="'Noto Serif SC', serif" font-size="60" font-weight="700" letter-spacing="1">找回专注的三个练习</text>

  <!-- 右：首字下沉导语 -->
  <text x="980" y="336" fill="#A82E1C" font-family="'Noto Serif SC', serif" font-size="136" font-weight="700">书</text>
  <g font-family="'Noto Serif SC', serif" font-size="28" fill="#4A433B">
    <text x="1132" y="240">不是一口气读完的。与其责怪自己分心，</text>
    <text x="1132" y="286">不如把阅读拆成可以练习的小动作。</text>
    <text x="1132" y="332">下面三步，每一步只需要十分钟。</text>
  </g>
  <rect x="160" y="376" width="1600" height="1.5" fill="#1A1714"/>

  <!-- 水平进程线 -->
  <rect x="160" y="424" width="1600" height="1.5" fill="#9C9080"/>
  <rect x="160" y="419" width="12" height="12" fill="#A82E1C"/>
  <rect x="693" y="419" width="12" height="12" fill="#1A1714"/>
  <rect x="1226" y="419" width="12" height="12" fill="#1A1714"/>
  <g font-family="'Noto Sans SC', sans-serif" font-size="24" font-weight="600" fill="#6B6155" letter-spacing="2">
    <text x="190" y="412">第一步</text>
    <text x="723" y="412">第二步</text>
    <text x="1256" y="412">第三步</text>
  </g>

  <!-- 三栏步骤 -->
  <rect x="677" y="452" width="1.5" height="220" fill="#CBC1AF"/>
  <rect x="1210" y="452" width="1.5" height="220" fill="#CBC1AF"/>
  <g font-family="'Noto Serif SC', serif">
    <text x="154" y="550" fill="#1A1714" font-size="96" font-weight="700">01</text>
    <text x="160" y="614" fill="#1A1714" font-size="36" font-weight="700">只在纸上读开头</text>
    <text x="160" y="660" fill="#4A433B" font-size="26">前十页交给纸，屏幕留到之后。</text>

    <text x="687" y="550" fill="#1A1714" font-size="96" font-weight="700">02</text>
    <text x="693" y="614" fill="#1A1714" font-size="36" font-weight="700">把手机放进另一个房间</text>
    <text x="693" y="660" fill="#4A433B" font-size="26">看不见，比开静音更有效。</text>

    <text x="1220" y="550" fill="#1A1714" font-size="96" font-weight="700">03</text>
    <text x="1226" y="614" fill="#1A1714" font-size="36" font-weight="700">读完一节，写下一句</text>
    <text x="1226" y="660" fill="#4A433B" font-size="26">用自己的话复述，才算真正读过。</text>
  </g>

  <!-- 引文与边注 -->
  <rect x="160" y="704" width="1600" height="1.5" fill="#1A1714"/>
  <text x="150" y="836" fill="#A82E1C" font-family="'Noto Serif SC', serif" font-size="96" font-weight="700">“</text>
  <g font-family="'Noto Serif SC', serif" font-weight="700" font-size="40" fill="#1A1714">
    <text x="244" y="772">专注不是天赋，</text>
    <text x="244" y="826">是一种可以练习的习惯。</text>
  </g>
  <text x="712" y="826" fill="#6B6155" font-family="'Noto Sans SC', sans-serif" font-size="24" font-weight="600" letter-spacing="2">—— 本期结语</text>

  <rect x="1226" y="736" width="534" height="100" fill="#EAE3D5"/>
  <g font-family="'Noto Sans SC', sans-serif" font-size="24" font-weight="600" fill="#6B6155" letter-spacing="2">
    <text x="1254" y="778">练习总时长</text>
  </g>
  <text x="1254" y="818" fill="#1A1714" font-family="'Noto Serif SC', serif" font-size="28" font-weight="700">三十分钟 · 顺序可以调换</text>

  <!-- 页脚（非关键，位于播放器避让区） -->
  <rect x="160" y="1000" width="1600" height="1.5" fill="#1A1714"/>
  <g font-family="'Noto Sans SC', sans-serif" font-size="24" font-weight="600" fill="#6B6155">
    <text x="160" y="1032" letter-spacing="2">三个练习</text>
    <text x="1760" y="1032" text-anchor="end" font-family="'Noto Serif SC', serif" font-weight="700" fill="#1A1714">52</text>
  </g>
</svg>
