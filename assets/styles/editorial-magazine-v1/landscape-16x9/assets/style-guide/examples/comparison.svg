<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#F4EFE6"/>

  <!-- 背景层：两栏的大字标记 -->
  <g font-family="'Noto Serif SC', serif" font-weight="700" font-size="300" fill="#EAE3D5" text-anchor="end">
    <text x="936" y="724">纸</text>
    <text x="1760" y="724">屏</text>
  </g>

  <!-- 版头 -->
  <g font-family="'Noto Sans SC', sans-serif">
    <text x="160" y="132" fill="#1A1714" font-size="24" font-weight="700" letter-spacing="4">长文 · 阅读与注意力</text>
    <text x="1760" y="132" text-anchor="end" fill="#6B6155" font-size="24" font-weight="600" letter-spacing="3">第 07 期</text>
  </g>
  <rect x="160" y="152" width="1600" height="4" fill="#1A1714"/>

  <!-- 标题区：左标题、右导语 -->
  <g font-family="'Noto Sans SC', sans-serif">
    <rect x="160" y="222" width="48" height="4" fill="#A82E1C"/>
    <text x="224" y="234" fill="#A82E1C" font-size="26" font-weight="700" letter-spacing="6">双栏对照</text>
  </g>
  <text x="158" y="318" fill="#1A1714" font-family="'Noto Serif SC', serif" font-size="64" font-weight="700" letter-spacing="1">纸上读，与屏上读</text>
  <text x="984" y="316" fill="#4A433B" font-family="'Noto Serif SC', serif" font-size="30">同一篇文章，换一种载体，读法就变了。</text>
  <rect x="160" y="356" width="1600" height="1.5" fill="#CBC1AF"/>

  <!-- 中缝 -->
  <rect x="959" y="386" width="1.5" height="348" fill="#CBC1AF"/>

  <!-- 栏头 -->
  <g font-family="'Noto Sans SC', sans-serif" font-size="24" font-weight="700" letter-spacing="3" fill="#6B6155">
    <text x="160" y="410">甲 · 纸页</text>
    <text x="984" y="410">乙 · 屏幕</text>
  </g>
  <g font-family="'Noto Serif SC', serif" font-weight="700" font-size="50" fill="#1A1714">
    <text x="160" y="476">一页一页</text>
    <text x="984" y="476">一屏一屏</text>
  </g>
  <rect x="160" y="500" width="776" height="3" fill="#1A1714"/>
  <rect x="984" y="500" width="776" height="3" fill="#1A1714"/>

  <!-- 对照条目：术语 + 说明同一行 -->
  <g font-family="'Noto Serif SC', serif" fill="#1A1714">
    <text x="160" y="562" font-size="32" font-weight="700">线性推进</text>
    <text x="363" y="562" font-size="26" fill="#4A433B">一行接一行，从头读到尾</text>
    <rect x="160" y="592" width="776" height="1.5" fill="#CBC1AF"/>
    <text x="160" y="644" font-size="32" font-weight="700">翻页停顿</text>
    <text x="363" y="644" font-size="26" fill="#4A433B">每一页都是一次小结</text>
    <rect x="160" y="674" width="776" height="1.5" fill="#CBC1AF"/>
    <text x="160" y="726" font-size="32" font-weight="700">空间记忆</text>
    <text x="363" y="726" font-size="26" fill="#4A433B">记得那句话在左页下方</text>

    <text x="984" y="562" font-size="32" font-weight="700">跳跃扫视</text>
    <text x="1187" y="562" font-size="26" fill="#4A433B">先看标题，再挑段落</text>
    <rect x="984" y="592" width="776" height="1.5" fill="#CBC1AF"/>
    <text x="984" y="644" font-size="32" font-weight="700">无尽滚动</text>
    <text x="1187" y="644" font-size="26" fill="#4A433B">没有页码，也没有终点</text>
    <rect x="984" y="674" width="776" height="1.5" fill="#CBC1AF"/>
    <text x="984" y="726" font-size="32" font-weight="700">位置模糊</text>
    <text x="1187" y="726" font-size="26" fill="#4A433B">只记得“好像在中间”</text>
  </g>

  <!-- 结论：横跨全宽 -->
  <rect x="160" y="760" width="1600" height="4" fill="#1A1714"/>
  <rect x="862" y="802" width="134" height="22" fill="#F2D9CF"/>
  <text x="160" y="822" fill="#1A1714" font-family="'Noto Serif SC', serif" font-weight="700" font-size="44">差别不在载体，在于读者是否被允许<tspan fill="#A82E1C">停下来</tspan>。</text>
  <text x="1760" y="820" text-anchor="end" fill="#6B6155" font-family="'Noto Sans SC', sans-serif" font-size="24" font-weight="600" letter-spacing="1">注：对照依据常见的阅读行为观察，仅作讨论。</text>

  <!-- 页脚（非关键，位于播放器避让区） -->
  <rect x="160" y="1000" width="1600" height="1.5" fill="#1A1714"/>
  <g font-family="'Noto Sans SC', sans-serif" font-size="24" font-weight="600" fill="#6B6155">
    <text x="160" y="1032" letter-spacing="2">纸与屏幕</text>
    <text x="1760" y="1032" text-anchor="end" font-family="'Noto Serif SC', serif" font-weight="700" fill="#1A1714">38</text>
  </g>
</svg>
