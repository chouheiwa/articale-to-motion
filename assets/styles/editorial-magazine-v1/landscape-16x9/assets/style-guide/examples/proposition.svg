<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#F4EFE6"/>
  <!-- 背景层：期号大字 -->
  <text x="1780" y="640" text-anchor="end" fill="#EAE3D5" font-family="'Noto Serif SC', serif" font-size="600" font-weight="700" letter-spacing="-16">07</text>

  <!-- 版头 -->
  <g font-family="'Noto Sans SC', sans-serif">
    <text x="160" y="132" fill="#1A1714" font-size="24" font-weight="700" letter-spacing="4">长文 · 阅读与注意力</text>
    <text x="1760" y="132" text-anchor="end" fill="#6B6155" font-size="24" font-weight="600" letter-spacing="3">第 07 期</text>
  </g>
  <rect x="160" y="152" width="1600" height="4" fill="#1A1714"/>
  <rect x="160" y="164" width="1600" height="1.5" fill="#1A1714"/>

  <!-- 眉题 -->
  <g font-family="'Noto Sans SC', sans-serif">
    <rect x="160" y="246" width="48" height="4" fill="#A82E1C"/>
    <text x="224" y="258" fill="#A82E1C" font-size="26" font-weight="700" letter-spacing="6">封面故事</text>
  </g>

  <!-- 封面标题：两行，左侧五栏 -->
  <g font-family="'Noto Serif SC', serif" font-weight="700" fill="#1A1714">
    <text x="154" y="392" font-size="112" letter-spacing="2">我们为何</text>
    <text x="154" y="522" font-size="112" letter-spacing="2">读不完一本书？</text>
  </g>

  <!-- 导语：左四栏 -->
  <rect x="160" y="584" width="788" height="1.5" fill="#CBC1AF"/>
  <g font-family="'Noto Serif SC', serif" fill="#4A433B" font-size="30">
    <text x="160" y="646">注意力没有消失，它只是被切成了碎片。</text>
    <text x="160" y="694">这一期，我们想回答一个朴素的问题：</text>
    <text x="160" y="742" fill="#1A1714" font-weight="700">深度阅读的能力，还能找回来吗？</text>
  </g>

  <!-- 边注栏：第五栏 -->
  <g font-family="'Noto Sans SC', sans-serif">
    <rect x="972" y="584" width="179" height="1.5" fill="#1A1714"/>
    <text x="972" y="632" fill="#6B6155" font-size="24" font-weight="600" letter-spacing="2">本期关键词</text>
    <text x="972" y="680" fill="#1A1714" font-size="26" font-weight="700">专注 · 耐心</text>
    <text x="972" y="722" fill="#1A1714" font-size="26" font-weight="700">纸与屏幕</text>
  </g>

  <!-- 右侧三栏：本期目录预告 -->
  <rect x="1175" y="584" width="585" height="176" fill="#EAE3D5"/>
  <rect x="1175" y="584" width="585" height="4" fill="#1A1714"/>
  <text x="1207" y="638" fill="#6B6155" font-family="'Noto Sans SC', sans-serif" font-size="24" font-weight="600" letter-spacing="3">同期阅读</text>
  <g font-family="'Noto Serif SC', serif" font-size="26">
    <text x="1207" y="688" fill="#A82E1C" font-weight="700">02</text>
    <text x="1257" y="688" fill="#1A1714">碎片时间是怎样被切出来的</text>
    <text x="1207" y="734" fill="#A82E1C" font-weight="700">03</text>
    <text x="1257" y="734" fill="#1A1714">纸与屏幕，读法不同</text>
  </g>
  <g font-family="'Noto Sans SC', sans-serif" font-size="24" font-weight="600" fill="#6B6155" text-anchor="end">
    <text x="1728" y="688">第 24 页</text>
    <text x="1728" y="734">第 38 页</text>
  </g>

  <!-- 署名行 -->
  <rect x="160" y="784" width="1600" height="1.5" fill="#CBC1AF"/>
  <g font-family="'Noto Sans SC', sans-serif" font-size="24">
    <text x="160" y="826" fill="#1A1714" font-weight="700" letter-spacing="2">文 / 本刊编辑部</text>
    <text x="1760" y="826" text-anchor="end" fill="#6B6155" font-weight="600" letter-spacing="2">阅读约 12 分钟</text>
  </g>

  <!-- 页脚（非关键，位于播放器避让区） -->
  <rect x="160" y="1000" width="1600" height="1.5" fill="#1A1714"/>
  <g font-family="'Noto Sans SC', sans-serif" font-size="24" font-weight="600" fill="#6B6155">
    <text x="160" y="1032" letter-spacing="2">封面故事</text>
    <text x="1760" y="1032" text-anchor="end" font-family="'Noto Serif SC', serif" font-weight="700" fill="#1A1714">07</text>
  </g>
</svg>
