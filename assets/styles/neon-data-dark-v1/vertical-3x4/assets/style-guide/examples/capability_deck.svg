  <text x="960" y="970" text-anchor="end" font-family="'Noto Sans SC', sans-serif" fill="#FF7A6B" font-size="24" font-weight="700">需关注</text>
  <text x="88" y="1154" font-family="'Noto Sans SC', sans-serif" fill="#9AA6BF" font-size="24">以上均为示意数据，不对应任何真实产品</text>
