<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M 72 0 L 0 0 0 72" fill="none" stroke="#1C2538" stroke-width="1.5"/>
    </pattern>
    <radialGradient id="haloV" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A493FF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#A493FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloL" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C8F560" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#C8F560" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C8F560" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#C8F560" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070A12" stop-opacity="0"/>
      <stop offset="1" stop-color="#070A12" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="b"/>
      <feComponentTransfer in="b" result="s"><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowDot" x="-400%" y="-400%" width="900%" height="900%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="b"/>
      <feComponentTransfer in="b" result="s"><feFuncA type="linear" slope="0.7"/></feComponentTransfer>
      <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="#070A12"/>
  <rect width="1920" height="1080" fill="url(#grid)" opacity="0.55"/>
  <circle cx="1720" cy="80" r="640" fill="url(#haloV)"/>
  <circle cx="420" cy="620" r="460" fill="url(#haloL)"/>
  <rect y="880" width="1920" height="200" fill="url(#fade)"/>
  <g fill="none" stroke="#5F6B85" stroke-width="2" opacity="0.7">
    <path d="M48 88v-40h40 M1832 48h40v40 M48 992v40h40 M1832 1032h40v-40"/>
  </g>
  <circle cx="172" cy="130" r="8" fill="#C8F560" filter="url(#glowDot)"/>
  <text x="194" y="140" font-family="'Noto Sans SC', sans-serif" fill="#EEF2FA" font-size="30" font-weight="700" letter-spacing="3">巨型指标</text>
  <text x="1760" y="138" text-anchor="end" font-family="'Space Grotesk', 'Noto Sans SC', sans-serif" fill="#9AA6BF" font-size="24" font-weight="500" letter-spacing="4">PROPOSITION</text>
  <rect x="160" y="172" width="1600" height="2" fill="#1C2538"/>
  <rect x="160" y="172" width="200" height="2" fill="#C8F560"/>
  <rect x="160" y="232" width="320" height="46" rx="23" fill="#0E1422" stroke="#5F6B85" stroke-width="1.5"/>
  <text x="320.0" y="263" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" fill="#9AA6BF" font-size="24" font-weight="600">示意数据 · 2023—2025</text>
  <text x="160" y="364" font-family="'Noto Sans SC', sans-serif" fill="#EEF2FA" font-size="58" font-weight="700">同样一百万 token</text>
  <text x="160" y="440" font-family="'Noto Sans SC', sans-serif" fill="#EEF2FA" font-size="58" font-weight="700">推理价格便宜了</text>
  <text x="150" y="770" font-family="'Space Grotesk', 'Noto Sans SC', sans-serif" fill="#C8F560" font-size="280" font-weight="700" letter-spacing="-8" filter="url(#glow)">40</text>
  <text x="503" y="770" font-family="'Space Grotesk', 'Noto Sans SC', sans-serif" fill="#C8F560" font-size="106" font-weight="700">×</text>
  <text x="612" y="640" font-family="'Noto Sans SC', sans-serif" fill="#EEF2FA" font-size="30" font-weight="600">单位推理成本</text>
  <text x="612" y="684" font-family="'Noto Sans SC', sans-serif" fill="#9AA6BF" font-size="26">两年间下降倍数</text>
  <rect x="980" y="232" width="780" height="600" rx="24" fill="#0E1422" stroke="#1C2538" stroke-width="1.5"/>
  <text x="1020" y="290" font-family="'Noto Sans SC', sans-serif" fill="#9AA6BF" font-size="24">每百万 token 价格（美元，示意）</text>
  <text x="1720" y="290" text-anchor="end" font-family="'Space Grotesk', 'Noto Sans SC', sans-serif" fill="#9AA6BF" font-size="20" font-weight="500" letter-spacing="3">HALF-YEAR</text>
  <line x1="1020" y1="360.0" x2="1720" y2="360.0" stroke="#1C2538" stroke-width="1.5" stroke-dasharray="6 8"/>
  <line x1="1020" y1="540.0" x2="1720" y2="540.0" stroke="#1C2538" stroke-width="1.5" stroke-dasharray="6 8"/>
  <polygon points="1052,720 1052,360.0 1180,540.0 1308,648.0 1436,684.0 1564,702.0 1692,711.0 1692,720" fill="url(#area)"/>
  <polyline points="1052,360.0 1180,540.0 1308,648.0 1436,684.0 1564,702.0 1692,711.0" fill="none" stroke="#C8F560" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="1020" y1="720" x2="1720" y2="720" stroke="#5F6B85" stroke-width="2"/>
  <circle cx="1180" cy="540.0" r="5" fill="#070A12" stroke="#C8F560" stroke-width="2.5"/>
  <circle cx="1308" cy="648.0" r="5" fill="#070A12" stroke="#C8F560" stroke-width="2.5"/>
  <circle cx="1436" cy="684.0" r="5" fill="#070A12" stroke="#C8F560" stroke-width="2.5"/>
  <circle cx="1564" cy="702.0" r="5" fill="#070A12" stroke="#C8F560" stroke-width="2.5"/>
  <circle cx="1052" cy="360.0" r="7" fill="#070A12" stroke="#C8F560" stroke-width="3"/>
  <text x="1074" y="370.0" font-family="'Space Grotesk', 'Noto Sans SC', sans-serif" fill="#EEF2FA" font-size="30" font-weight="700">$60</text>
  <text x="1198" y="524.0" font-family="'Space Grotesk', 'Noto Sans SC', sans-serif" fill="#9AA6BF" font-size="24" font-weight="500">$30</text>
  <circle cx="1692" cy="711.0" r="9" fill="#C8F560" filter="url(#glowDot)"/>
  <text x="1692" y="681.0" text-anchor="end" font-family="'Space Grotesk', 'Noto Sans SC', sans-serif" fill="#C8F560" font-size="30" font-weight="700">$1.5</text>
  <text x="1052" y="766" text-anchor="start" font-family="'Space Grotesk', 'Noto Sans SC', sans-serif" fill="#9AA6BF" font-size="24" font-weight="500">2023</text>
  <text x="1372.0" y="766" text-anchor="middle" font-family="'Space Grotesk', 'Noto Sans SC', sans-serif" fill="#9AA6BF" font-size="24" font-weight="500">2024</text>
  <text x="1692" y="766" text-anchor="end" font-family="'Space Grotesk', 'Noto Sans SC', sans-serif" fill="#9AA6BF" font-size="24" font-weight="500">2025</text>
  <line x1="1020" y1="790" x2="1720" y2="790" stroke="#1C2538" stroke-width="1.5"/>
  <text x="1020" y="816" font-family="'Noto Sans SC', sans-serif" fill="#9AA6BF" font-size="22" font-weight="500">起点 $60 → 终点 $1.5，价格只剩 1/40</text>
</svg>
