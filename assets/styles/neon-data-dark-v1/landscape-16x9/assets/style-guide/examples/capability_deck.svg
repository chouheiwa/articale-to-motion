  <text x="680" y="574" font-family="'Space Grotesk', 'Noto Sans SC', sans-serif" fill="#EEF2FA" font-size="36" font-weight="700">−28%</text>
  <polygon points="200,740 200,631.2 295.714,642.5 391.429,636.5 487.143,663.5 582.857,689.0 678.571,683.0 774.286,708.5 870,725.0 870,740" fill="url(#area)"/>
  <polyline points="200,631.2 295.714,642.5 391.429,636.5 487.143,663.5 582.857,689.0 678.571,683.0 774.286,708.5 870,725.0" fill="none" stroke="#C8F560" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="200" y1="740" x2="870" y2="740" stroke="#5F6B85" stroke-width="2"/>
  <circle cx="870" cy="725.0" r="8" fill="#C8F560" filter="url(#glowDot)"/>
  <text x="200" y="776" font-family="'Space Grotesk', 'Noto Sans SC', sans-serif" fill="#9AA6BF" font-size="22" font-weight="500">D1</text>
  <text x="870" y="776" text-anchor="end" font-family="'Space Grotesk', 'Noto Sans SC', sans-serif" fill="#9AA6BF" font-size="22" font-weight="500">D7</text>
  <text x="535.0" y="776" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" fill="#9AA6BF" font-size="22" font-weight="500">纵轴自 300ms 起（截断）</text>
  <rect x="936" y="330" width="404" height="227" rx="16" fill="#0E1422" stroke="#1C2538" stroke-width="1.5"/>
