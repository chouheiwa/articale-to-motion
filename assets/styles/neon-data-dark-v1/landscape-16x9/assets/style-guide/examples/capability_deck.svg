  <text x="966" y="500" font-family="'Space Grotesk', 'Noto Sans SC', sans-serif" fill="#EEF2FA" font-size="80" font-weight="700">1,850<tspan dx="10" font-size="30" fill="#9AA6BF" font-weight="500">tok/s</tspan></text>
  <rect x="1356" y="330" width="404" height="227" rx="16" fill="#0E1422" stroke="#1C2538" stroke-width="1.5"/>
  <text x="1388" y="386" font-family="'Noto Sans SC', sans-serif" fill="#9AA6BF" font-size="26" font-weight="600">准确率</text>
  <text x="1386" y="500" font-family="'Space Grotesk', 'Noto Sans SC', sans-serif" fill="#EEF2FA" font-size="80" font-weight="700">86<tspan dx="10" font-size="30" fill="#9AA6BF" font-weight="500">%</tspan></text>
  <rect x="936" y="573" width="404" height="227" rx="16" fill="#0E1422" stroke="#1C2538" stroke-width="1.5"/>
  <text x="968" y="629" font-family="'Noto Sans SC', sans-serif" fill="#9AA6BF" font-size="26" font-weight="600">可用性</text>
  <text x="966" y="743" font-family="'Space Grotesk', 'Noto Sans SC', sans-serif" fill="#EEF2FA" font-size="80" font-weight="700">99.9<tspan dx="10" font-size="30" fill="#9AA6BF" font-weight="500">%</tspan></text>
  <rect x="1356" y="573" width="404" height="227" rx="16" fill="#0E1422" stroke="#FF7A6B" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="1388" y="629" font-family="'Noto Sans SC', sans-serif" fill="#9AA6BF" font-size="26" font-weight="600">拒答误伤</text>
  <text x="1386" y="743" font-family="'Space Grotesk', 'Noto Sans SC', sans-serif" fill="#FF7A6B" font-size="80" font-weight="700">3.2<tspan dx="10" font-size="30" fill="#9AA6BF" font-weight="500">%</tspan></text>
  <text x="1728" y="629" text-anchor="end" font-family="'Noto Sans SC', sans-serif" fill="#FF7A6B" font-size="24" font-weight="700">需关注</text>
  <text x="160" y="850" font-family="'Noto Sans SC', sans-serif" fill="#9AA6BF" font-size="24">以上均为示意数据，不对应任何真实产品</text>
</svg>
