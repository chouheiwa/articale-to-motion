  <text x="200" y="388" font-family="'Noto Sans SC', sans-serif" fill="#9AA6BF" font-size="26" font-weight="600">首字延迟 · P50</text>
  <text x="880" y="388" text-anchor="end" font-family="'Space Grotesk', 'Noto Sans SC', sans-serif" fill="#9AA6BF" font-size="24" font-weight="500">7 DAYS</text>
  <text x="190" y="580" font-family="'Space Grotesk', 'Noto Sans SC', sans-serif" fill="#C8F560" font-size="200" font-weight="700" letter-spacing="-4" filter="url(#glow)">320</text>
  <text x="560" y="580" font-family="'Space Grotesk', 'Noto Sans SC', sans-serif" fill="#C8F560" font-size="64" font-weight="700">ms</text>
