  <text x="1362" y="608" font-family="'Space Grotesk', 'Noto Sans SC', sans-serif" fill="#FF7A6B" font-size="144" font-weight="700" letter-spacing="-4">62<tspan dx="8" font-size="56" font-weight="700">%</tspan></text>
  <text x="1370" y="664" font-family="'Noto Sans SC', sans-serif" fill="#EEF2FA" font-size="28" font-weight="600">的访客没开始试用</text>
  <line x1="1370" y1="702" x2="1720" y2="702" stroke="#1C2538" stroke-width="1.5"/>
