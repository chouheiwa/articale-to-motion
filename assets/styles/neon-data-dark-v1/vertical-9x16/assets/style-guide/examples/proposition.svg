  <text x="88" y="458" font-family="'Noto Sans SC', sans-serif" fill="#EEF2FA" font-size="64" font-weight="700">同样一百万 token</text>
  <text x="88" y="540" font-family="'Noto Sans SC', sans-serif" fill="#EEF2FA" font-size="64" font-weight="700">推理价格便宜了</text>
  <text x="80" y="928" font-family="'Space Grotesk', 'Noto Sans SC', sans-serif" fill="#C8F560" font-size="320" font-weight="700" letter-spacing="-8" filter="url(#glow)">40</text>
  <text x="483" y="928" font-family="'Space Grotesk', 'Noto Sans SC', sans-serif" fill="#C8F560" font-size="122" font-weight="700">×</text>
