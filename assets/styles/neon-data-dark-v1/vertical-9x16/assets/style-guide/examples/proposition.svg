  <polyline points="140,1098.0 282,1253.0 424,1346.0 566,1377.0 708,1392.5 850,1400.2" fill="none" stroke="#C8F560" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="124" y1="1408" x2="864" y2="1408" stroke="#5F6B85" stroke-width="2"/>
  <circle cx="140" cy="1098.0" r="7" fill="#070A12" stroke="#C8F560" stroke-width="3"/>
