  <text x="400" y="1314" font-family="'Space Grotesk', 'Noto Sans SC', sans-serif" fill="#C8F560" font-size="32" font-weight="700">13%</text>
  <rect x="88" y="1396" width="812" height="200" rx="16" fill="#151D2F" stroke="#1C2538" stroke-width="1.5"/>
  <rect x="88" y="1414" width="5" height="164" rx="2.5" fill="#C8F560"/>
  <text x="124" y="1463" font-family="'Noto Sans SC', sans-serif" fill="#EEF2FA" font-size="30" font-weight="600">六成访客没有开始试用。</text>
  <text x="124" y="1507" font-family="'Noto Sans SC', sans-serif" fill="#EEF2FA" font-size="30" font-weight="600">首步留存每多 10 个点，</text>
  <text x="124" y="1550" font-family="'Noto Sans SC', sans-serif" fill="#EEF2FA" font-size="30" font-weight="600">付费约多 340 人</text>
