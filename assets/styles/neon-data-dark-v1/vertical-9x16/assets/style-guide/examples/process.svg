  <text x="88" y="876" font-family="'Space Grotesk', 'Noto Sans SC', sans-serif" fill="#9AA6BF" font-size="26" font-weight="500">3,800 人</text>
  <rect x="300" y="802" width="228" height="84" rx="12" fill="#151D2F" stroke="#5F6B85" stroke-width="1.5"/>
  <text x="550" y="854" font-family="'Space Grotesk', 'Noto Sans SC', sans-serif" fill="#EEF2FA" font-size="32" font-weight="700">38%</text>
  <path d="M314 941v22m-7 -8l7 8 7-8" fill="none" stroke="#9AA6BF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="338" y="965" font-family="'Noto Sans SC', sans-serif" fill="#9AA6BF" font-size="24" font-weight="500">留存 68%</text>
