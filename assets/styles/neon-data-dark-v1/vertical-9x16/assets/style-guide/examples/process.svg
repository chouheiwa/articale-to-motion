  <text x="88" y="310" font-family="'Noto Sans SC', sans-serif" fill="#EEF2FA" font-size="62" font-weight="700">一款 AI 写作工具</text>
  <text x="88" y="388" font-family="'Noto Sans SC', sans-serif" fill="#EEF2FA" font-size="62" font-weight="700">从访问到付费</text>
  <rect x="88" y="478" width="244" height="46" rx="23" fill="#0E1422" stroke="#5F6B85" stroke-width="1.5"/>
