<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M 72 0 L 0 0 0 72" fill="none" stroke="#1C2538" stroke-width="1.5"/>
    </pattern>
    <radialGradient id="haloV" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A493FF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#A493FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloL" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C8F560" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#C8F560" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C8F560" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#C8F560" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="b"/>
      <feComponentTransfer in="b" result="s"><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowDot" x="-400%" y="-400%" width="900%" height="900%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="b"/>
      <feComponentTransfer in="b" result="s"><feFuncA type="linear" slope="0.7"/></feComponentTransfer>
      <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1080" height="1920" fill="#070A12"/>
  <rect width="1080" height="1920" fill="url(#grid)" opacity="0.55"/>
  <circle cx="960" cy="140" r="520" fill="url(#haloV)"/>
  <circle cx="300" cy="700" r="420" fill="url(#haloL)"/>
  <g fill="none" stroke="#5F6B85" stroke-width="2" opacity="0.7">
    <path d="M40 140v-44h44 M996 96h44v44 M40 1820v40h44 M996 1860h44v-40"/>
  </g>
  <circle cx="96" cy="138" r="8" fill="#C8F560" filter="url(#glowDot)"/>
  <text x="118" y="148" font-family="'Noto Sans SC', sans-serif" fill="#EEF2FA" font-size="30" font-weight="700" letter-spacing="3">指标看板</text>
  <text x="992" y="146" text-anchor="end" font-family="'Space Grotesk', 'Noto Sans SC', sans-serif" fill="#9AA6BF" font-size="24" font-weight="500" letter-spacing="4">CAPABILITY DECK</text>
  <rect x="88" y="180" width="904" height="2" fill="#1C2538"/>
  <rect x="88" y="180" width="200" height="2" fill="#C8F560"/>
  <text x="88" y="310" font-family="'Noto Sans SC', sans-serif" fill="#EEF2FA" font-size="62" font-weight="700">模型上线之前</text>
  <text x="88" y="388" font-family="'Noto Sans SC', sans-serif" fill="#EEF2FA" font-size="62" font-weight="700">先看这五个数</text>
  <rect x="660" y="354" width="240" height="46" rx="23" fill="#0E1422" stroke="#5F6B85" stroke-width="1.5"/>
  <text x="780.0" y="385" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" fill="#9AA6BF" font-size="24" font-weight="600">示意 · 压测环境</text>
  <rect x="88" y="442" width="904" height="540" rx="24" fill="#151D2F" stroke="#1C2538" stroke-width="1.5"/>
  <rect x="88" y="470" width="5" height="484" rx="2.5" fill="#C8F560"/>
  <text x="128" y="500" font-family="'Noto Sans SC', sans-serif" fill="#9AA6BF" font-size="26" font-weight="600">首字延迟 · P50</text>
  <text x="120" y="692" font-family="'Space Grotesk', 'Noto Sans SC', sans-serif" fill="#C8F560" font-size="200" font-weight="700" letter-spacing="-4" filter="url(#glow)">320</text>
  <text x="492" y="692" font-family="'Space Grotesk', 'Noto Sans SC', sans-serif" fill="#C8F560" font-size="56" font-weight="700">ms</text>
  <text x="128" y="756" font-family="'Noto Sans SC', sans-serif" fill="#9AA6BF" font-size="26">近 7 天从 480ms 降到 320ms</text>
  <line x1="128" y1="938" x2="880" y2="938" stroke="#5F6B85" stroke-width="2"/>
  <polygon points="128,926 128,802.0 210,809.8 293,821.4 375,840.8 458,864.0 540,871.8 623,895.0 705,902.8 788,918.2 870,926.0 870,926" fill="url(#area)"/>
  <polyline points="128,802.0 210,809.8 293,821.4 375,840.8 458,864.0 540,871.8 623,895.0 705,902.8 788,918.2 870,926.0" fill="none" stroke="#C8F560" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="870" cy="926.0" r="8" fill="#C8F560" filter="url(#glowDot)"/>
  <rect x="88" y="998" width="444" height="280" rx="16" fill="#0E1422" stroke="#1C2538" stroke-width="1.5" stroke-opacity="1"/>
  <text x="120" y="1050" font-family="'Noto Sans SC', sans-serif" fill="#9AA6BF" font-size="26" font-weight="600">吞吐</text>
  <text x="118" y="1202" font-family="'Space Grotesk', 'Noto Sans SC', sans-serif" fill="#EEF2FA" font-size="96" font-weight="700">1,850<tspan dx="10" font-size="30" fill="#9AA6BF" font-weight="500">tok/s</tspan></text>
  <text x="120" y="1250" font-family="'Noto Sans SC', sans-serif" fill="#9AA6BF" font-size="24">峰值时段 · 单卡</text>
  <rect x="548" y="998" width="444" height="280" rx="16" fill="#0E1422" stroke="#1C2538" stroke-width="1.5" stroke-opacity="1"/>
  <text x="580" y="1050" font-family="'Noto Sans SC', sans-serif" fill="#9AA6BF" font-size="26" font-weight="600">准确率</text>
  <text x="578" y="1202" font-family="'Space Grotesk', 'Noto Sans SC', sans-serif" fill="#EEF2FA" font-size="96" font-weight="700">86<tspan dx="10" font-size="30" fill="#9AA6BF" font-weight="500">%</tspan></text>
  <text x="580" y="1250" font-family="'Noto Sans SC', sans-serif" fill="#9AA6BF" font-size="24">内部评测集</text>
  <rect x="88" y="1294" width="444" height="280" rx="16" fill="#0E1422" stroke="#1C2538" stroke-width="1.5" stroke-opacity="1"/>
  <text x="120" y="1346" font-family="'Noto Sans SC', sans-serif" fill="#9AA6BF" font-size="26" font-weight="600">可用性</text>
  <text x="118" y="1498" font-family="'Space Grotesk', 'Noto Sans SC', sans-serif" fill="#EEF2FA" font-size="96" font-weight="700">99.9<tspan dx="10" font-size="30" fill="#9AA6BF" font-weight="500">%</tspan></text>
  <text x="120" y="1546" font-family="'Noto Sans SC', sans-serif" fill="#9AA6BF" font-size="24">近 30 天</text>
  <rect x="548" y="1294" width="444" height="280" rx="16" fill="#0E1422" stroke="#FF7A6B" stroke-width="1.5" stroke-opacity="0.7"/>
  <text x="580" y="1346" font-family="'Noto Sans SC', sans-serif" fill="#9AA6BF" font-size="26" font-weight="600">拒答误伤</text>
  <text x="578" y="1498" font-family="'Space Grotesk', 'Noto Sans SC', sans-serif" fill="#FF7A6B" font-size="96" font-weight="700">3.2<tspan dx="10" font-size="30" fill="#9AA6BF" font-weight="500">%</tspan></text>
  <text x="960" y="1346" text-anchor="end" font-family="'Noto Sans SC', sans-serif" fill="#FF7A6B" font-size="24" font-weight="700">需关注</text>
  <text x="580" y="1546" font-family="'Noto Sans SC', sans-serif" fill="#9AA6BF" font-size="24">正常请求被拒比例</text>
  <text x="88" y="1630" font-family="'Noto Sans SC', sans-serif" fill="#9AA6BF" font-size="24">以上均为示意数据，不对应任何真实产品</text>
</svg>
